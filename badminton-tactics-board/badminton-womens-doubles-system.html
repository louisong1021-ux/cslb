<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>羽毛球女双完整体系｜详细版 L1–L6</title><style>
:root{--bg:#07111b;--panel:#0f1e2f;--panel2:#14283e;--text:#eef7ff;--muted:#9db0c3;--line:rgba(255,255,255,.08);--g:#72f2b1;--b:#49caff;--y:#ffd66b;--p:#c8b8ff;--o:#ffb56b;--r:#ff8e8e}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% 0,rgba(73,202,255,.08),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.72}.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;overflow:auto;padding:22px 16px;background:rgba(8,20,31,.97);border-right:1px solid var(--line)}.brand{padding:2px 8px 16px;border-bottom:1px solid var(--line)}.brand h1{margin:0 0 5px;font-size:20px}.brand p{margin:0;color:var(--muted);font-size:12px}.home{display:inline-block;margin-top:9px;color:var(--g);font-size:12px;text-decoration:none}.level-title{margin:18px 7px 7px;font-size:10px;font-weight:950;letter-spacing:.08em;color:#71869c}.menu{display:grid;gap:4px}.menu button{width:100%;display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;border:1px solid transparent;border-radius:10px;background:transparent;color:#afbfce;text-align:left;padding:8px 9px;cursor:pointer}.menu button:hover{background:#102135}.menu button.active{background:linear-gradient(135deg,rgba(114,242,177,.13),rgba(73,202,255,.07));border-color:rgba(114,242,177,.22);color:white}.badge{height:29px;border-radius:8px;background:#0c1927;display:grid;place-items:center;font-size:9px;font-weight:950;color:var(--g)}.menu button span:last-child{font-size:12px}.main{min-width:0}.mobile{display:none;position:sticky;top:0;z-index:10;padding:8px 10px;background:rgba(8,20,31,.97);border-bottom:1px solid var(--line);gap:8px}.mobile a{height:42px;padding:0 11px;border-radius:10px;background:var(--g);color:#06131a;display:flex;align-items:center;text-decoration:none;font-size:12px;font-weight:900;white-space:nowrap}.mobile select{flex:1;min-width:0;height:42px;border-radius:10px;background:#102033;color:white;border:1px solid var(--line);padding:0 9px}.content{max-width:1030px;margin:auto;padding:45px 34px 75px}.chapter{display:none}.chapter.active{display:block}.k{color:var(--g);font-size:12px;font-weight:950;letter-spacing:.08em}.chapter h2{font-size:clamp(31px,5vw,49px);line-height:1.12;margin:9px 0 12px}.lead{font-size:17px;color:#bdcad7;max-width:900px}.formula,.call{margin:20px 0;padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,rgba(114,242,177,.10),rgba(73,202,255,.07));border:1px solid rgba(114,242,177,.18);font-weight:800}.call{border-left:4px solid var(--b);font-weight:650}.sec{margin:29px 0}.sec h3{font-size:22px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{padding:16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel2),#0c1a29)}.card strong{display:block;margin-bottom:5px}.card p{margin:0;color:#b2c1d0;font-size:14px}.tbl{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:780px;background:#0c1927}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#14283e;font-size:12px;color:#e8faf0}td{font-size:13px;color:#bac8d6}.seq{padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#091723;font-weight:850}.prob{display:grid;gap:8px}.prow{display:grid;grid-template-columns:95px 1fr;gap:10px;padding:10px 11px;background:#0d1b2a;border:1px solid var(--line);border-radius:10px}.rank{background:var(--g);color:#06131a;font-size:10px;font-weight:950;border-radius:7px;padding:4px 7px;text-align:center;height:max-content}.prow:nth-child(2) .rank{background:var(--b)}.prow:nth-child(3) .rank{background:var(--y)}ul,ol{padding-left:22px}li{margin:5px 0;color:#bdcad7}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}.nav button{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#102033;color:white;cursor:pointer}.nav button:disabled{opacity:.35}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.mobile{display:flex}.content{padding:28px 18px 60px}.grid{grid-template-columns:1fr}.nav{position:sticky;bottom:0;margin-left:-18px;margin-right:-18px;padding:10px 18px;background:linear-gradient(180deg,transparent,rgba(7,17,27,.97) 28%);border:0}.nav button{flex:1}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><h1>女双完整体系</h1><p>详细版 · L1–L6 · 连续质量与组合韧性</p><a class="home" href="badminton-doubles.html">← 返回总入口</a></div><div id="menus"></div></aside><main class="main"><div class="mobile"><a href="badminton-doubles.html">← 总入口</a><select id="sel"></select></div><div class="content" id="content"></div></main></div><script>
const C=[
[1,'核心思维','女双的核心不是“多打一拍”，而是多拍以后质量仍不掉',`<p class="lead">高水平女双同样很快，但比赛经常由连续进攻质量、防守韧性、轮转稳定和长回合中的决策质量决定。</p><div class="formula">女双结构 = 稳定前三拍 → 连续高质量压迫 → 前场持续读取 → 防守不崩 → 轮转不断线</div><div class="call">“能坚持”不等于“高质量连续”。真正目标是第5拍、第9拍以后仍保持正确击球点、线路和责任。</div>`],
[1,'发球','发球质量决定你能不能进入稳定前三拍',`<div class="prob"><div class="prow"><span class="rank">第一目标</span><div>低、稳、不过高，让接发者不能轻松扑。</div></div><div class="prow"><span class="rank">第二目标</span><div>1/2/3前场落点变化，避免接发站位固定。</div></div><div class="prow"><span class="rank">第三目标</span><div>4身体位与5/6偷后场作为变化，不让对方接发过度前压。</div></div></div><div class="call">固定编号：1前左、2前中/T、3前右、4身体位、5后场左角、6后场右角。</div>`],
[1,'接发球','接发的价值是压低并建立下一拍可持续结构',`<div class="grid"><div class="card"><strong>放网</strong><p>低、短，但必须准备对方回放和推身后。</p></div><div class="card"><strong>推4号位</strong><p>挤身体，减少对手第三拍完整挥拍。</p></div><div class="card"><strong>推5/6</strong><p>拉开前后距离，测试对方后场第一拍质量。</p></div><div class="card"><strong>被动挑深</strong><p>抢不到高点时先建立完整左右防守，不送半场。</p></div></div>`],
[1,'第三拍与第四拍','女双前三拍之后更要看“连续性”',`<p class="lead">第三拍拿到下压并不等于回合结束。女双经常需要第四、第五拍继续保持结构。</p><div class="seq">第三拍下压 → 对方挡回 → 第四拍继续维持高点/中路/身体压力 → 前场读取 → 再轮转</div>`],
[1,'连续进攻','杀、点杀、快吊不是替代关系，而是连续质量组合',`<div class="grid"><div class="card"><strong>重杀</strong><p>真正压住时用来降低对手击球点。</p></div><div class="card"><strong>点杀</strong><p>保持速度和角度，减少连续动作成本。</p></div><div class="card"><strong>快吊</strong><p>让防守后压的对手突然前冲。</p></div><div class="card"><strong>身体球</strong><p>压缩挥拍，增加短挡和软中路概率。</p></div></div><div class="call">连续三拍都重杀、但每拍质量下降，不叫连续进攻，只叫连续消耗。</div>`],
[1,'前场压迫','前场任务是让对方很难从防守变舒服',`<ul><li>后场球质量高：前场偏置短线/中路。</li><li>后场球普通：保持中性，不贴死。</li><li>被越顶后立即进入新责任，不留在原位置。</li><li>抓不到第一拍时，重点保证第二次启动。</li></ul>`],
[1,'防守三出口','女双防守不能只有起高球',`<div class="grid"><div class="card"><strong>挡网</strong><p>对方后场重心后时，把对方重新拉前。</p></div><div class="card"><strong>抽中路</strong><p>有高点时压两人之间，争取打回平抽。</p></div><div class="card"><strong>顶深</strong><p>把进攻者重新压到底线，降低连续进攻效率。</p></div><div class="card"><strong>深挑</strong><p>最低点下先重置，深度优先。</p></div></div>`],
[1,'防守转攻','真正的防守能力是知道什么时候阵型已经可以变',`<div class="seq">高质量挡网 → 挡网者前压 → 搭档开始承担后场 → 从左右防守切到前后进攻</div><p class="lead">很多组合防守球已经成功，但两个人仍留在左右，于是主动权白白丢掉。</p>`],
[1,'轮转','女双轮转重在连续不掉线',`<ul><li>谁制造向上回球，谁更接近前场责任。</li><li>前场被越顶后先处理，再按回球质量换位。</li><li>后场进攻质量下降，两人同步降低激进程度。</li><li>被迫起高后立即转左右，不继续前后站。</li></ul>`],
[1,'中路责任','连续回合里中路责任更容易累积出错',`<div class="tbl"><table><tr><th>情形</th><th>责任重点</th></tr><tr><td>左右防守</td><td>提前约定正手/身体位优先，不临时互让</td></tr><tr><td>平抽</td><td>身体中路压迫时谁高点谁优先</td></tr><tr><td>前后进攻</td><td>前场优先处理中前场，后场不抢前场可控球</td></tr></table></div>`],
[1,'典型错误','女双最常见的结构错误',`<div class="tbl"><table><tr><th>错误</th><th>后果</th><th>先改</th></tr><tr><td>后场每拍都重杀</td><td>后续球质掉、轮转慢</td><td>加入点杀/快吊/身体球</td></tr><tr><td>前场贴网太死</td><td>越顶后断轮转</td><td>按球质偏置</td></tr><tr><td>防守只起高</td><td>长期被压</td><td>建立三出口</td></tr><tr><td>挡网成功仍留左右</td><td>错失转攻</td><td>挡网者前压</td></tr><tr><td>长回合只想“坚持”</td><td>动作质量越来越低</td><td>关注每拍击球点与恢复</td></tr></table></div>`],
[1,'训练体系','基础训练必须从“稳定”进入“有选择的连续”',`<ol><li>固定杀吊组合 + 前场跟进。</li><li>防守三出口两选一。</li><li>加入第三答案和轮转。</li><li>限制连续回合：必须保持高点和正确阵型。</li><li>完整比赛统计“第5拍以后球质下降点”。</li></ol>`],

[2,'中高级框架','女双中高级不是更复杂，而是连续质量更稳定',`<div class="formula">稳定压迫 → 固定对手防守位置 → 变速度/身体/中路 → 读取保护 → 继续轮转</div><p class="lead">真正难打的组合不是每拍变化，而是在需要变化前一直保持高质量。</p>`],
[2,'杀吊组合','用速度层次制造前后重心变化',`<div class="seq">重杀/点杀建立后压 → 快吊逼前冲 → 下一拍再压身后或中路</div><div class="call">变化的前提是前面的进攻真的有威胁；没有深度和速度，慢球只会给对手时间。</div>`],
[2,'身体与中路','高成功率压力点往往不在边线',`<ul><li>杀持拍肩/髋，限制完整挥拍。</li><li>连续打两人之间，测试责任。</li><li>当两人开始挤中保护，再打外侧。</li><li>身体球后前场重点准备短挡和软中路。</li></ul>`],
[2,'前场第二启动','前场价值不只是一扑',`<div class="grid"><div class="card"><strong>第一启动</strong><p>按后场球质偏置自然线路。</p></div><div class="card"><strong>第二启动</strong><p>第一答案没出现，仍能后撤/横移处理反方向。</p></div><div class="card"><strong>拦中路</strong><p>优先压低，不一定每球直接扑死。</p></div><div class="card"><strong>再制造</strong><p>推身后/放网也可以继续制造下一拍。</p></div></div>`],
[2,'防守转攻升级','防守出口要跟对方站位绑定',`<div class="prob"><div class="prow"><span class="rank">对方后场很后</span><div>挡网价值上升。</div></div><div class="prow"><span class="rank">前场压得死</span><div>抽中路/顶深更安全。</div></div><div class="prow"><span class="rank">自己完全低点</span><div>先深挑，不强求反击。</div></div></div>`],
[2,'连续轮转','轮转不能只会一次交换',`<p class="lead">女双长回合中可能连续出现前后→左右→前后多次切换。每次切换都要根据真实球权，而不是“该轮到谁”。</p><div class="seq">主动权变化 → 两人同步判断 → 新责任 → 新站位 → 下一次触发</div>`],
[2,'平抽与变速','女双平抽同样要争高点，但更重视持续质量',`<ul><li>身体前触球，拍头不掉。</li><li>压身体/中路比盲目追边线稳定。</li><li>连续快压后主动挡网改变高度。</li><li>一旦触球点掉下去，先退出速度战。</li></ul>`],
[2,'长回合节奏','长回合里要主动决定什么时候加速',`<div class="grid"><div class="card"><strong>中性阶段</strong><p>保持深度和线路，不抢高风险。</p></div><div class="card"><strong>出现低点</strong><p>立刻压时间，进入主动阶段。</p></div><div class="card"><strong>自己球质下降</strong><p>主动降速/重置，而不是硬撑。</p></div><div class="card"><strong>对手疲劳</strong><p>增加前后调动和二次启动测试。</p></div></div>`],
[2,'对手类型','先识别对方靠什么维持连续性',`<div class="tbl"><table><tr><th>类型</th><th>特点</th><th>先测试</th></tr><tr><td>后场连续型</td><td>压很多拍仍稳定</td><td>前后变化、身体、中路</td></tr><tr><td>前场读取型</td><td>网前很难穿</td><td>越顶、推后与第二启动</td></tr><tr><td>防守韧性型</td><td>很难直接打穿</td><td>连续质量、耐心、保护变化</td></tr><tr><td>快节奏型</td><td>前三拍和平抽主动</td><td>挡网变速、深后场</td></tr></table></div>`],
[2,'比分与风险','关键分不是保守，而是提高可重复性',`<div class="grid"><div class="card"><strong>领先</strong><p>维持已经有效的连续结构，不因怕失误主动放弃压迫。</p></div><div class="card"><strong>落后</strong><p>先找上游断点，不用每分强行加速。</p></div><div class="card"><strong>19平</strong><p>用本场已验证的发接发和防守出口。</p></div><div class="card"><strong>决胜局</strong><p>体能下降时把球质和轮转稳定放在第一位。</p></div></div>`],

[3,'高级比赛阅读','读的是“谁先掉质量”，不是谁最后失误',`<div class="formula">连续回合 → 某一环节先下降 → 对方开始保护 → 新空间出现 → 再攻击</div><p class="lead">高级女双的关键常在最后失误前两三拍已经发生。</p>`],
[3,'连续性模型','建立每个对手的质量下降曲线',`<ul><li>第几拍后后场深度开始不足？</li><li>第几次连续防守后挡网开始变短？</li><li>长回合后谁回位更慢？</li><li>谁在疲劳时线路明显收缩？</li></ul>`],
[3,'Pair Model','把两人的稳定性和互补关系一起记录',`<div class="grid"><div class="card"><strong>后场</strong><p>谁更稳定、谁连续几拍后质量先掉。</p></div><div class="card"><strong>前场</strong><p>谁读取快、谁被越顶后恢复慢。</p></div><div class="card"><strong>防守</strong><p>谁更喜欢挡网/抽中/挑高。</p></div><div class="card"><strong>关键分</strong><p>谁更主动，谁选择更收缩。</p></div></div>`],
[3,'保护模型','弱点被连续针对后，搭档会怎么补',`<div class="seq">压A后场 → B开始多接中路/提前轮转 → B原责任区变薄 → 进入反保护</div><div class="call">高级针对不是一直打同一个人，而是利用“另一个人开始帮助”的瞬间。</div>`],
[3,'节奏模型','有些组合怕快，有些组合更怕“快慢不固定”',`<ul><li>观察持续快节奏时谁先失误。</li><li>观察慢下来后谁反而舒服。</li><li>观察长回合突然加速时两人谁启动迟。</li><li>把节奏变化和疲劳一起记录。</li></ul>`],
[3,'诱导与反诱导','连续性本身可以制造预期',`<div class="grid"><div class="card"><strong>诱导</strong><p>连续身体压迫，让防守开始挤中，再突然外侧。</p></div><div class="card"><strong>反诱导</strong><p>对方故意让出外侧时，不要看到空档就打。</p></div><div class="card"><strong>重复</strong><p>同一高质量线路重复本身就是建立预期。</p></div><div class="card"><strong>退出</strong><p>对方调整明显后，旧模型降权。</p></div></div>`],
[3,'阵型操控','控制的是两人的距离和恢复成本',`<ul><li>连续后场让两人重心后移，再突然网前。</li><li>连续中路让两人挤中，再打外侧。</li><li>连续一侧建立保护，再换另一侧。</li><li>让对方频繁前后交换，增加轮转成本。</li></ul>`],
[3,'关键分模型','压力下最容易暴露真正默认答案',`<div class="tbl"><table><tr><th>观察</th><th>可能意义</th></tr><tr><td>更多直线</td><td>降低风险</td></tr><tr><td>更多挑高</td><td>不敢抢中前场</td></tr><tr><td>更多短发/放网</td><td>希望把节奏控制在前三拍</td></tr><tr><td>连续重杀</td><td>可能急于终结</td></tr></table></div>`],
[3,'录像与数据','录像重点看质量下降点和轮转断点',`<ul><li>第5拍以后谁先掉击球点。</li><li>防守三出口实际用了哪些。</li><li>挡网成功后是否及时转前后。</li><li>前场站位是否符合上一拍球质。</li><li>中路责任失分从哪一拍开始。</li></ul>`],
[3,'比赛控制框架','高级女双不是等对方失误，而是管理连续质量',`<div class="formula">建立稳定连续 → 找到对方质量下降点 → 逼保护 → 反保护 → 关键分调用已验证结构</div>`],

[4,'球质等级','连续进攻也必须先判断A/B/C/D',`<div class="tbl"><table><tr><th>等级</th><th>含义</th><th>组合许可</th></tr><tr><td>A</td><td>对手低点、失衡、明显晚到</td><td>前场积极压，后场抢时间</td></tr><tr><td>B</td><td>有压力但还能转换</td><td>前场偏置，后场继续构建</td></tr><tr><td>C</td><td>中性</td><td>重新争高点、深度和节奏</td></tr><tr><td>D</td><td>我方失衡/低点</td><td>立即取消前压，恢复安全阵型</td></tr></table></div>`],
[4,'时间·击球点·姿态','长回合里位置相同，质量可能完全不同',`<ul><li>是否提前到位？</li><li>触球在身体前还是身后？</li><li>落地后能否马上恢复？</li><li>连续多拍以后动作是否开始变形？</li></ul><div class="seq">到位时间 → 击球点 → 姿态 → 恢复 → 决定下一拍许可</div>`],
[4,'技术—战术耦合','“连续”必须建立在可重复技术质量上',`<div class="grid"><div class="card"><strong>点杀</strong><p>速度、角度和恢复缺一不可。</p></div><div class="card"><strong>快吊</strong><p>必须与下压准备一致，否则没有欺骗。</p></div><div class="card"><strong>防守挡网</strong><p>过网质量和自己前移能力共同决定能否转攻。</p></div><div class="card"><strong>轮转</strong><p>技术动作结束姿态直接决定下一责任能否接上。</p></div></div>`],
[4,'连续压迫许可','不是每一拍都必须继续进攻',`<div class="prob"><div class="prow"><span class="rank">A球</span><div>继续抢时间，前场主动压。</div></div><div class="prow"><span class="rank">B球</span><div>保持连续，减少孤注一掷。</div></div><div class="prow"><span class="rank">C/D球</span><div>主动降级，先恢复结构。</div></div></div>`],
[4,'Pair Profile','职业模型要包含“质量维持能力”',`<ul><li>后场连续几拍后开始掉深度。</li><li>防守连续几拍后开始只剩挑高。</li><li>轮转频繁后谁更容易慢半拍。</li><li>关键分谁更容易改变原本打法。</li></ul>`],
[4,'动态优先级','实时球质永远大于赛前设定',`<div class="formula">当前球质 ＞ 当前姿态/疲劳 ＞ 搭档位置 ＞ 稳定历史趋势 ＞ 预设套路</div>`],
[4,'降级与恢复','知道什么时候暂停进攻，是高级连续能力的一部分',`<p class="lead">真正强的组合不是永远往前冲，而是在B/C级阶段主动稳住一拍，再重新拿到A级机会。</p><div class="call">“暂时不进攻”不等于失去主动；错误的强攻才会真正丢主动。</div>`],
[4,'职业训练闭环','训练要把长回合中的判断也保留下来',`<ol><li>A/B/C/D报级。</li><li>连续8–12拍限制训练，要求每拍保持结构。</li><li>故意加入疲劳后再做防转攻判断。</li><li>练“主动降级一拍再重新压”。</li><li>比赛验证第5拍以后质量。</li></ol>`],

[5,'赛前 Scouting','找出对方组合在哪种连续结构下最先掉质量',`<div class="grid"><div class="card"><strong>前三拍</strong><p>谁接发稳定、谁容易被身体位挤住。</p></div><div class="card"><strong>后场</strong><p>谁连续能力更弱、什么时候掉深度。</p></div><div class="card"><strong>防守</strong><p>三出口里缺哪一种。</p></div><div class="card"><strong>轮转</strong><p>频繁交换后谁先慢。</p></div></div>`],
[5,'前6分测试','用低风险测试确认连续性假设',`<ol><li>测试身体球后的防守出口。</li><li>测试中路责任。</li><li>测试一人连续后场三拍后的质量。</li><li>测试挡网后是否能及时转攻。</li><li>测试被针对后搭档保护方式。</li></ol>`],
[5,'连续结构测试','不是只测试“弱点”，而是测试崩溃顺序',`<div class="seq">连续压身体 → 看谁先短 → 再压该人后场 → 看搭档如何保护 → 攻保护后的空间</div>`],
[5,'Plan A / B / C','不同体能与比分状态要有不同连续方案',`<div class="grid"><div class="card"><strong>Plan A</strong><p>主连续压迫结构。</p></div><div class="card"><strong>Plan B</strong><p>对方开始保护后的反保护。</p></div><div class="card"><strong>Plan C</strong><p>我方疲劳时靠深度、防守和稳定轮转维持比赛。</p></div><div class="card"><strong>退出条件</strong><p>连续几拍质量下降后主动结束当前结构。</p></div></div>`],
[5,'局间管理','11分时先判断“谁的质量先掉”',`<div class="seq">模式确认 → 上游质量下降点 → 一个战术调整 → 一个轮转责任 → 下一分验证</div>`],
[5,'关键分','关键分最怕突然把连续打法变成一拍终结',`<ul><li>使用已验证的发接发。</li><li>继续相信高质量连续，不因为紧张突然重杀。</li><li>防守优先最稳定出口。</li><li>对方保护变化确认后再切第二层。</li></ul>`],
[5,'体能与环境','球速、风向和体能会改变连续结构成本',`<div class="grid"><div class="card"><strong>慢球</strong><p>直接终结更难，连续质量更重要。</p></div><div class="card"><strong>快球</strong><p>深度和边线风险增加，前三拍价值上升。</p></div><div class="card"><strong>顺风</strong><p>后场长度风险更高。</p></div><div class="card"><strong>疲劳</strong><p>降低无效重杀，保持击球点和轮转。</p></div></div>`],
[5,'赛后验证','赛后区分体能、技术、战术和组合责任',`<div class="tbl"><table><tr><th>问题</th><th>分类</th></tr><tr><td>第几拍开始后场变短？</td><td>技术/体能</td></tr><tr><td>挡网成功但不转攻？</td><td>责任/战术</td></tr><tr><td>前场越顶后回不来？</td><td>移动/轮转</td></tr><tr><td>关键分突然重杀？</td><td>决策/心理</td></tr></table></div>`],
[5,'比赛工程闭环','把一场比赛变成下一场更准确的模型',`<div class="formula">赛前假设 → 前6分验证 → 中局修正 → 关键分执行 → 赛后分类 → 更新Pair Profile</div>`],

[6,'Pair Identity','长期先定义这对女双靠什么赢',`<div class="grid"><div class="card"><strong>连续后场型</strong><p>靠稳定下压和体能。</p></div><div class="card"><strong>前场读取型</strong><p>靠网前压迫和二次启动。</p></div><div class="card"><strong>防守反击型</strong><p>靠高质量防守出口。</p></div><div class="card"><strong>快速轮转型</strong><p>靠两人全面和位置交换。</p></div></div>`],
[6,'角色互补','角色不是谁固定前后，而是谁在哪个功能更稳定',`<ul><li>谁更适合连续后场。</li><li>谁前场读取和二次启动更强。</li><li>谁防守变线更稳定。</li><li>谁关键分接发更可靠。</li><li>谁在疲劳下决策更稳。</li></ul>`],
[6,'技术限制链','长回合质量下降必须追到真正原因',`<div class="formula">球质掉 → 击球点低？ → 移动慢？ → 动作成本大？ → 恢复差？ → 体能下降？ → 战术选择错误？</div>`],
[6,'体能—战术耦合','体能训练必须看球质，不只是完成次数',`<ul><li>连续后场多拍后是否仍有深度。</li><li>疲劳时防守拍头是否掉。</li><li>长回合后轮转判断是否慢。</li><li>体能下降后是否知道主动降级。</li></ul>`],
[6,'组合 KPI','指标围绕“连续质量”设计',`<ul><li>第5拍后进攻质量保持率。</li><li>防守转攻率。</li><li>挡网后成功建立前后阵型率。</li><li>轮转断点次数。</li><li>中路责任失误。</li><li>关键分连续结构执行率。</li></ul>`],
[6,'沟通协议','连续回合越长，责任协议越重要',`<div class="tbl"><table><tr><th>场景</th><th>提前约定</th></tr><tr><td>前场被越顶</td><td>谁处理、另一人补哪里</td></tr><tr><td>挡网转攻</td><td>挡网者是否留前</td></tr><tr><td>中路防守</td><td>谁优先</td></tr><tr><td>B/C级球</td><td>前场偏置程度</td></tr></table></div>`],
[6,'训练周期','周期化不是减少训练，而是改变质量目标',`<div class="grid"><div class="card"><strong>基础期</strong><p>技术可重复性、体能和责任。</p></div><div class="card"><strong>专项期</strong><p>连续进攻、防转攻和轮转。</p></div><div class="card"><strong>赛前期</strong><p>对手专项、关键分和球速适应。</p></div><div class="card"><strong>比赛期</strong><p>恢复、维持高质量，减少无意义疲劳。</p></div></div>`],
[6,'疲劳模型','必须知道“这个组合从哪里开始掉”',`<p class="lead">长期记录：连续后场、长回合防守、连续轮转、第三局关键分，分别从什么阶段开始出现技术和判断下降。</p><div class="call">疲劳模型不是为了证明“体能差”，而是为了决定战术什么时候必须降级。</div>`],
[6,'对手库与长期闭环','长期积累让比赛阅读越来越快',`<div class="formula">录像 → 连续性模型 → 训练限制条件 → 比赛验证 → 更新Pair Identity与对手库</div>`]
];
const menus=document.getElementById('menus'),sel=document.getElementById('sel'),content=document.getElementById('content');let cur=0,lastL=0;C.forEach((c,i)=>{if(c[0]!==lastL){lastL=c[0];const t=document.createElement('div');t.className='level-title';t.textContent=`L${c[0]} · ${['','基础结构','中高级战术','高级比赛阅读','国际职业决策','比赛工程','高性能组合'][c[0]]}`;menus.appendChild(t)}const wrap=document.createElement('div');wrap.className='menu';const n=C.filter((x,j)=>j<=i&&x[0]===c[0]).length,b=document.createElement('button');b.innerHTML=`<span class="badge">L${c[0]}-${String(n).padStart(2,'0')}</span><span>${c[1]}</span>`;b.onclick=()=>show(i,true);wrap.appendChild(b);menus.appendChild(wrap);const o=document.createElement('option');o.value=i;o.textContent=`L${c[0]} · ${c[1]}`;sel.appendChild(o);const s=document.createElement('section');s.className='chapter';s.innerHTML=`<div class="k">L${c[0]} · ${c[1]}</div><h2>${c[2]}</h2>${c[3]}`;content.appendChild(s)});const nav=document.createElement('div');nav.className='nav';nav.innerHTML='<button id="prev">← 上一章</button><button id="next">下一章 →</button>';content.appendChild(nav);const secs=[...document.querySelectorAll('.chapter')],btns=[...document.querySelectorAll('.menu button')],prev=document.getElementById('prev'),next=document.getElementById('next');function show(i,push=false){cur=Math.max(0,Math.min(C.length-1,i));secs.forEach((s,n)=>s.classList.toggle('active',n===cur));btns.forEach((b,n)=>b.classList.toggle('active',n===cur));sel.value=cur;prev.disabled=cur===0;next.disabled=cur===C.length-1;if(push)history.replaceState(null,'',`#l${C[cur][0]}-c${C.filter((x,j)=>j<=cur&&x[0]===C[cur][0]).length}`);scrollTo({top:0,behavior:'smooth'})}sel.onchange=()=>show(+sel.value,true);prev.onclick=()=>show(cur-1,true);next.onclick=()=>show(cur+1,true);const m=location.hash.match(/l(\d)-c(\d+)/);if(m){const ids=C.map((x,i)=>x[0]===+m[1]?i:null).filter(x=>x!==null);show(ids[Math.max(0,+m[2]-1)]??0,false)}else show(0,false);
</script></body></html>
