<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>羽毛球男双完整体系｜详细版 L1–L6</title><style>
:root{--bg:#07111b;--panel:#0f1e2f;--panel2:#14283e;--text:#eef7ff;--muted:#9db0c3;--line:rgba(255,255,255,.08);--g:#72f2b1;--b:#49caff;--y:#ffd66b;--p:#c8b8ff;--o:#ffb56b;--r:#ff8e8e}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% 0,rgba(73,202,255,.08),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.72}.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;overflow:auto;padding:22px 16px;background:rgba(8,20,31,.97);border-right:1px solid var(--line)}.brand{padding:2px 8px 16px;border-bottom:1px solid var(--line)}.brand h1{margin:0 0 5px;font-size:20px}.brand p{margin:0;color:var(--muted);font-size:12px}.home{display:inline-block;margin-top:9px;color:var(--g);font-size:12px;text-decoration:none}.level-title{margin:18px 7px 7px;font-size:10px;font-weight:950;letter-spacing:.08em;color:#71869c}.menu{display:grid;gap:4px}.menu button{width:100%;display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;border:1px solid transparent;border-radius:10px;background:transparent;color:#afbfce;text-align:left;padding:8px 9px;cursor:pointer}.menu button:hover{background:#102135}.menu button.active{background:linear-gradient(135deg,rgba(114,242,177,.13),rgba(73,202,255,.07));border-color:rgba(114,242,177,.22);color:white}.badge{height:29px;border-radius:8px;background:#0c1927;display:grid;place-items:center;font-size:9px;font-weight:950;color:var(--g)}.menu button span:last-child{font-size:12px}.main{min-width:0}.mobile{display:none;position:sticky;top:0;z-index:10;padding:8px 10px;background:rgba(8,20,31,.97);border-bottom:1px solid var(--line);gap:8px}.mobile a{height:42px;padding:0 11px;border-radius:10px;background:var(--g);color:#06131a;display:flex;align-items:center;text-decoration:none;font-size:12px;font-weight:900;white-space:nowrap}.mobile select{flex:1;min-width:0;height:42px;border-radius:10px;background:#102033;color:white;border:1px solid var(--line);padding:0 9px}.content{max-width:1030px;margin:auto;padding:45px 34px 75px}.chapter{display:none}.chapter.active{display:block}.k{color:var(--g);font-size:12px;font-weight:950;letter-spacing:.08em}.chapter h2{font-size:clamp(31px,5vw,49px);line-height:1.12;margin:9px 0 12px}.lead{font-size:17px;color:#bdcad7;max-width:900px}.formula,.call{margin:20px 0;padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,rgba(114,242,177,.10),rgba(73,202,255,.07));border:1px solid rgba(114,242,177,.18);font-weight:800}.call{border-left:4px solid var(--b);font-weight:650}.sec{margin:29px 0}.sec h3{font-size:22px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{padding:16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel2),#0c1a29)}.card strong{display:block;margin-bottom:5px}.card p{margin:0;color:#b2c1d0;font-size:14px}.tbl{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:780px;background:#0c1927}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#14283e;font-size:12px;color:#e8faf0}td{font-size:13px;color:#bac8d6}.seq{padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#091723;font-weight:850}.prob{display:grid;gap:8px}.prow{display:grid;grid-template-columns:95px 1fr;gap:10px;padding:10px 11px;background:#0d1b2a;border:1px solid var(--line);border-radius:10px}.rank{background:var(--g);color:#06131a;font-size:10px;font-weight:950;border-radius:7px;padding:4px 7px;text-align:center;height:max-content}.prow:nth-child(2) .rank{background:var(--b)}.prow:nth-child(3) .rank{background:var(--y)}ul,ol{padding-left:22px}li{margin:5px 0;color:#bdcad7}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}.nav button{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#102033;color:white;cursor:pointer}.nav button:disabled{opacity:.35}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.mobile{display:flex}.content{padding:28px 18px 60px}.grid{grid-template-columns:1fr}.nav{position:sticky;bottom:0;margin-left:-18px;margin-right:-18px;padding:10px 18px;background:linear-gradient(180deg,transparent,rgba(7,17,27,.97) 28%);border:0}.nav button{flex:1}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><h1>男双完整体系</h1><p>详细版 · L1–L6 · 每一级拆成真实章节</p><a class="home" href="badminton-doubles.html">← 返回总入口</a></div><div id="menus"></div></aside><main class="main"><div class="mobile"><a href="badminton-doubles.html">← 总入口</a><select id="sel"></select></div><div class="content" id="content"></div></main></div><script>
const C=[
[1,'核心思维','男双不是“越快越好”',`<p class="lead">男双基础是让两个人在高速度下仍共享同一个判断：这一拍在逼什么、谁负责下一拍、主动权变化后阵型怎么切。</p><div class="formula">男双结构 = 制造高概率弱回球 → 搭档提前准备 → 第一答案没出现也有第二责任</div><div class="grid"><div class="card"><strong>速度服从质量</strong><p>快球如果击球点低、线路可预测，只会把自己带进更快的被动。</p></div><div class="card"><strong>两个人必须读同一个触发</strong><p>后场认为是A级球、前场却按C级站；或反过来，杀封都会断。</p></div></div><div class="call">每一拍先问：我们现在主动、中性还是被动？下一拍谁的责任最大？</div>`],
[1,'发球','发球不是结束，是第三拍的起点',`<p class="lead">短发的价值是让接发者难以高点下压，并让发球者有机会参与第三拍。</p><div class="prob"><div class="prow"><span class="rank">第一目标</span><div>过网低、落点稳定，让接发者不能舒服扑。</div></div><div class="prow"><span class="rank">第二目标</span><div>落点变化：1/2/3前场与4身体位，避免接发者完全前压。</div></div><div class="prow"><span class="rank">第三目标</span><div>5/6偷后场只在对手明显前压时使用，价值来自突然性。</div></div></div><div class="call">固定编号：1前左、2前中/T、3前右、4身体位、5后场左角、6后场右角。</div>`],
[1,'接发球','接发第一目标：压低，不送第三拍',`<div class="grid"><div class="card"><strong>放网</strong><p>低、短、自己能继续守网；不是越贴网越好。</p></div><div class="card"><strong>推身体</strong><p>4号位制造正反手切换迟疑，并让发球者难直接封死。</p></div><div class="card"><strong>推后场</strong><p>5/6号位把发球队员拉离前三拍舒服区，但必须有速度和深度。</p></div><div class="card"><strong>被动挑球</strong><p>确实抢不到高点时再挑，尽量深并立即进入左右防守。</p></div></div><div class="seq">接发完成以后，不看球：接发者继续中前场；搭档同步读取对方第三拍。</div>`],
[1,'第三拍','第三拍决定谁先拿到下压',`<p class="lead">发球队不是“发完让搭档打”，接发球队也不是“接完就结束”。第三拍责任必须预先理解。</p><div class="tbl"><table><tr><th>情形</th><th>发球者</th><th>搭档</th></tr><tr><td>对方放网</td><td>优先封中前场</td><td>准备后场和中路补位</td></tr><tr><td>对方推后场</td><td>不贴死网，准备横移/后撤</td><td>高点击球争取下压</td></tr><tr><td>对方推身体/中路</td><td>拍头高，争平挡或挡网</td><td>准备越过发球者后的下一拍</td></tr></table></div>`],
[1,'后场进攻','杀球不是终点，是制造下一拍',`<div class="grid"><div class="card"><strong>杀身体</strong><p>限制挥拍空间，常制造短挡、平挡或软中路。</p></div><div class="card"><strong>杀直线</strong><p>线路短，方便前场做直线+中路概率偏置。</p></div><div class="card"><strong>点杀</strong><p>保持速度但降低恢复成本，适合连续组织。</p></div><div class="card"><strong>快吊</strong><p>在对手防守后压时突然改变触球高度和前后节奏。</p></div></div><div class="call">评价后场进攻不要只看球速：要看对手击球点有没有下降、我方前场有没有更容易抓下一拍。</div>`],
[1,'杀封','前场不是猜方向，而是按球质偏置',`<div class="prob"><div class="prow"><span class="rank">第一准备</span><div>上一拍高质量直线杀：直线软挡 + 中路。</div></div><div class="prow"><span class="rank">第二准备</span><div>对手有能力改变拍面：保留斜线第二启动。</div></div><div class="prow"><span class="rank">第三准备</span><div>后场球质普通：前场不贴死，先维持中性压迫。</div></div></div><div class="seq">杀得住才压；杀不住只偏；普通球不赌。</div>`],
[1,'平抽挡','高点击球比单纯“快”更重要',`<ul><li>拍头保持高，尽量在身体前方触球。</li><li>优先身体、中路、持拍侧肩膀等压缩挥拍空间的位置。</li><li>发现触球点越来越低时，不要继续硬拼速度；主动挡一拍、顶深或换节奏。</li><li>搭档必须跟着球的高度和方向微调，而不是两个人站死。</li></ul><div class="call">平抽输掉通常不是“手不够快”，而是前两拍已经让自己的触球点逐渐下降。</div>`],
[1,'中路责任','中路不是空档，是责任测试',`<div class="grid"><div class="card"><strong>防守中路</strong><p>提前约定正手优先、身体位责任与特殊站位，不允许临时互让。</p></div><div class="card"><strong>进攻中路</strong><p>打两人之间能压缩挥拍并制造“谁拿”的迟疑。</p></div></div><div class="tbl"><table><tr><th>错误</th><th>结果</th><th>修正</th></tr><tr><td>两人都抢</td><td>碰拍/外侧空</td><td>固定责任优先级</td></tr><tr><td>两人都让</td><td>中路直接失分</td><td>按阵型和正反手提前约定</td></tr></table></div>`],
[1,'防守反击','防守目标不是把球救回去，而是降低对方下一拍质量',`<div class="grid"><div class="card"><strong>挡网</strong><p>对手后场重心较后且前场不贴死时，挡网可直接改变阵型。</p></div><div class="card"><strong>抽中路</strong><p>高点击球时通过身体/中路把对方从前后进攻打回平抽。</p></div><div class="card"><strong>顶深</strong><p>被压但仍有空间时顶到底线，重置对方进攻位置。</p></div><div class="card"><strong>高质量挑球</strong><p>最低点时先活下来，深度优先，不强行反攻。</p></div></div>`],
[1,'轮转','轮转是责任切换，不是两个人绕圈',`<div class="seq">谁制造向上回球 → 更有机会前压；谁被越顶 → 处理越顶后承担新后场；另一人同步补新责任区。</div><ul><li>前场被越过以后不要仍站网前等。</li><li>后场击球后不要停底线，要根据自己球质恢复。</li><li>挡网转攻成功时，挡网者通常更接近前场责任。</li><li>被迫起高以后，立刻从前后转左右。</li></ul>`],
[1,'典型错误','20个最常见的男双结构错误',`<div class="tbl"><table><tr><th>#</th><th>错误</th><th>核心原因</th></tr>${['发球后站着看','接发只会放网','一被压就自动挑球','后场只想一拍杀死','前场看着搭档杀','前场贴网太死','杀直线后前场赌死直线','两个人一起抢中路','两个人都不管中路','后场击球后停底线','防守一直后退','平抽只知道更快','打完才找搭档','被迫起高仍前后站','挡网成功仍左右防守','总打边线','看到空档就打不看重心','按固定拍数执行套路','只看球不看对方搭档','一直打同一弱点不看保护'].map((x,i)=>`<tr><td>${i+1}</td><td>${x}</td><td>${i<5?'下一拍责任/球质意识不足':i<10?'阵型与责任不清':i<15?'主动权变化判断慢':'战术触发与对手阅读不足'}</td></tr>`).join('')}</table></div><div class="call">优先改：自动挑球、前场不跟压、中路责任、后场不恢复、起高后不转左右。</div>`],
[1,'训练体系','从固定动作到比赛自动判断',`<div class="prob"><div class="prow"><span class="rank">阶段1</span><div>固定答案：只练站位和责任。</div></div><div class="prow"><span class="rank">阶段2</span><div>两个答案：开始判断。</div></div><div class="prow"><span class="rank">阶段3</span><div>三个答案 + 触发条件。</div></div></div><ol><li>发接发前三拍。</li><li>杀身体 + 前场抓软球。</li><li>杀直线 + 直线/中路封网。</li><li>平抽变速。</li><li>防守三出口。</li><li>半开放完整回合。</li></ol>`],

[2,'条件分支','中高级套路必须有“如果…那么…”',`<p class="lead">固定A→B只适合建立动作。进入中高级后，每套战术都要根据对手实际答案分支。</p><div class="formula">触发条件 → 第一高概率答案 → 第二答案 → 搭档同步续接</div><div class="call">套路不是连续三拍背下来，而是让对手的选择越来越少。</div>`],
[2,'发接发第二层','接发变化不是为了花，而是破坏对方预判',`<div class="grid"><div class="card"><strong>同准备动作</strong><p>放网、推4、推5/6尽量晚决定，减少拍面提前暴露。</p></div><div class="card"><strong>连续同一路后变化</strong><p>先让对方第三拍习惯某一答案，再突然改变。</p></div><div class="card"><strong>针对发球者</strong><p>发球者习惯前压时，多推身后/身体。</p></div><div class="card"><strong>针对后场搭档</strong><p>搭档过早抢中路时，改变到边线/后场。</p></div></div>`],
[2,'第四拍意识','前三拍之后真正区分中高级',`<p class="lead">很多球员能设计前三拍，但第三拍没直接得分就失去计划。第四拍要读取对方解决方案。</p><div class="seq">发/接 → 第三拍建立主动 → 对方第一解决方案 → 第四拍继续压同一结构或打反方向</div>`],
[2,'概率封网','前场站位是概率偏置，不是封死一条线',`<div class="tbl"><table><tr><th>上一拍</th><th>前场偏置</th><th>仍必须保留</th></tr><tr><td>高质量直线杀</td><td>直线 + 中路</td><td>斜线第二启动</td></tr><tr><td>高质量身体杀</td><td>中路/短挡</td><td>平抽身后</td></tr><tr><td>普通下压</td><td>轻微偏向自然线路</td><td>整体中性</td></tr></table></div>`],
[2,'平抽变速','真正的快，是让对手无法舒服建立节奏',`<ul><li>快压建立后退趋势，再突然软挡。</li><li>连续压身体后突然推空档。</li><li>不要在低点击球时继续加速。</li><li>搭档准备对方被迫抬高后的抢压。</li></ul><div class="seq">快 → 快 → 对手重心后 → 慢一拍 → 抢下一拍。</div>`],
[2,'连续轮转','把一次轮转变成连续责任链',`<div class="grid"><div class="card"><strong>后场压出短球</strong><p>制造者向前跟，原前场根据来球越顶与否换后。</p></div><div class="card"><strong>前场被越顶</strong><p>先处理越顶，不急着强行换回原位。</p></div><div class="card"><strong>挡网转攻</strong><p>挡网者前压，搭档开始准备后场。</p></div><div class="card"><strong>进攻质量下降</strong><p>两人同步降低压迫，不允许一人仍赌前场。</p></div></div>`],
[2,'防守升级','从“接住”升级到“设计出口”',`<div class="prob"><div class="prow"><span class="rank">有高点</span><div>优先抽身体/中路，直接争平抽主动。</div></div><div class="prow"><span class="rank">对方后压</span><div>挡网，迫使后场前冲。</div></div><div class="prow"><span class="rank">完全低点</span><div>深挑重置，不冒险送半场。</div></div></div>`],
[2,'对手类型','不同组合不能用同一套男双打法',`<div class="tbl"><table><tr><th>类型</th><th>典型特点</th><th>先测试</th></tr><tr><td>前三拍强</td><td>发接发抢得快</td><td>身体位、推后场、延长第四拍</td></tr><tr><td>后场重杀型</td><td>起高后压力大</td><td>防守出口与其恢复</td></tr><tr><td>平抽型</td><td>中前场速度强</td><td>变速、挡网、深后场</td></tr><tr><td>防守反击型</td><td>很难一拍打穿</td><td>连续球质量和前后调动</td></tr></table></div>`],
[2,'左右手组合','左右手不是天然优势，责任清楚才是优势',`<ul><li>中路正手覆盖范围更大，但必须提前约定谁优先。</li><li>发接发站位可利用两侧正手下压。</li><li>前后轮转时不要为了保留“正手后场”强行交换。</li><li>真正价值是让更多中场球落在正手高点击球区。</li></ul>`],
[2,'比分策略','比分改变风险，不改变基本判断',`<div class="grid"><div class="card"><strong>开局</strong><p>先收集发接发和压力下答案，不急着暴露全部变化。</p></div><div class="card"><strong>中段</strong><p>建立主得分结构，并观察对方保护。</p></div><div class="card"><strong>关键分</strong><p>调用已经验证的模式，减少临时高风险变化。</p></div><div class="card"><strong>领先</strong><p>不要因为怕失误主动放弃本来有效的压迫。</p></div></div>`],

[3,'高级比赛阅读','从看球升级到看“对手为什么只能这样回”',`<div class="formula">压力越大 → 选择越收窄 → 默认答案越稳定 → 越容易提前准备</div><p class="lead">高级阅读不追求猜中每一球，而是持续缩小对手下一拍的选项。</p>`],
[3,'Pair Model','必须把对手当成一对组合建模',`<div class="grid"><div class="card"><strong>接发模型</strong><p>谁更主动、谁更爱放网、谁被4号位挤住。</p></div><div class="card"><strong>后场模型</strong><p>谁连续能力强、被推身后后默认线路。</p></div><div class="card"><strong>前场模型</strong><p>谁更敢赌、谁越顶后恢复慢。</p></div><div class="card"><strong>保护模型</strong><p>A被针对以后B怎么提前补位。</p></div></div>`],
[3,'压力答案','只记录压力下重复出现的趋势',`<p class="lead">舒服状态下能打十种球不重要；被挤住、晚到、低点击球时最常用什么才最可利用。</p><div class="seq">一次 = 线索；两次 = 候选；同条件多次重复 = 可进入主模型；对方调整后立即降权。</div>`],
[3,'诱导','主动制造你想看的答案',`<ul><li>连续杀身体，让对手开始默认短挡，再抢前场。</li><li>连续压某人后场，逼搭档提前保护，再打保护产生的空间。</li><li>连续平抽后压，让对手重心后移，再突然挡网。</li></ul><div class="call">职业思维不是“空档在哪”，而是“我怎样让空档出现”。</div>`],
[3,'反诱导','对手也在观察你的默认答案',`<div class="grid"><div class="card"><strong>识别诱饵</strong><p>某个看似开放的线路是否连续出现得过于明显？</p></div><div class="card"><strong>延迟暴露</strong><p>准备动作一致，避免自己先把答案交出去。</p></div><div class="card"><strong>第二选择</strong><p>当发现对方在等你的习惯球，先用安全变化破模型。</p></div><div class="card"><strong>不必每次反套路</strong><p>对方只猜一次，不值得彻底推翻有效主打法。</p></div></div>`],
[3,'战术决策树','每套高级战术至少有三层',`<div class="seq">第一层：主压结构 → 第二层：对方保护后的反保护 → 第三层：对方开始反诱导后的安全回归</div><div class="call">没有退出条件的“高级套路”，只是复杂一点的固定套路。</div>`],
[3,'双人同步决策','两个人需要共享的不是位置，而是判断标准',`<ul><li>什么算A级/B级下压。</li><li>什么球允许前场赌，什么球只能偏置。</li><li>谁被越顶后谁接管后场。</li><li>什么时候从进攻降级到中性/防守。</li><li>关键分默认安全结构是什么。</li></ul>`],
[3,'阵型操控','不要只打空档，要操控对手阵型',`<div class="grid"><div class="card"><strong>拉开</strong><p>连续边线后突然中路，利用两人回位距离。</p></div><div class="card"><strong>挤中</strong><p>连续身体/中路后突然打外侧。</p></div><div class="card"><strong>吸前</strong><p>挡网/放网让对手前冲，再推后。</p></div><div class="card"><strong>赶后</strong><p>连续后场后突然前场，制造第一启动方向反差。</p></div></div>`],
[3,'动作一致性','假动作的前提是基本动作真的一致',`<ul><li>后场杀、点杀、快吊的准备高度尽量一致。</li><li>接发放网/推身体/推后场不提前改变握拍和身体。</li><li>前场推、放、勾在高点时延迟最后拍面。</li><li>假动作不能牺牲实际球质，否则失去战术许可。</li></ul>`],
[3,'保护与反保护','高级男双真正针对的是“保护关系”',`<div class="formula">压A → B开始保护 → B的原责任区变薄 → 打新空间 → 迫使两人重新分工</div><p class="lead">一直打一个弱点，打到对方已经全面保护还不变化，是常见高级错误。</p>`],
[3,'关键分','19平以后不要临时成为另一个人',`<ol><li>优先本场已经成功过的发球落点。</li><li>接发使用最稳定且对方最难提前压的方案。</li><li>第三拍责任说清楚。</li><li>如果第一方案没形成，立即回安全结构。</li></ol>`],
[3,'录像与数据','数据必须回答“为什么”，不只记录得失分',`<div class="tbl"><table><tr><th>记录</th><th>意义</th></tr><tr><td>前三拍谁先下压</td><td>发接发主动权</td></tr><tr><td>杀球后是否产生低回球</td><td>真实进攻质量</td></tr><tr><td>前场启动是否与球质匹配</td><td>双人同步</td></tr><tr><td>防守出口</td><td>被动转中性/主动能力</td></tr><tr><td>中路责任失误</td><td>组合协议问题</td></tr></table></div>`],

[4,'球质等级','A/B/C/D先决定你有没有战术许可',`<div class="tbl"><table><tr><th>等级</th><th>对手状态</th><th>我方许可</th></tr><tr><td>A</td><td>低点、身后、失衡、明显晚到</td><td>前场积极压，后场继续抢时间</td></tr><tr><td>B</td><td>受压但还能转换</td><td>前场偏置，保留第二启动</td></tr><tr><td>C</td><td>中性</td><td>先争高点、速度、中路</td></tr><tr><td>D</td><td>我方被动/低点/失衡</td><td>取消进攻计划，先恢复结构</td></tr></table></div><div class="seq">A级能压，B级偏置，C级中性，D级先活下来。</div>`],
[4,'时间·击球点·姿态','位置相同，不代表压力相同',`<ul><li>对手是提前到、刚好到还是晚到？</li><li>触球点在身体前、侧面还是身后？</li><li>身体是否稳定，还是单脚、后仰、被挤住？</li><li>击球后第一恢复步往哪？</li></ul><div class="seq">看位置 → 看是否到位 → 看触球点 → 看姿态 → 看第一恢复步 → 再做概率站位</div>`],
[4,'技术—战术耦合','理论正确，不代表你这一拍做得到',`<div class="grid"><div class="card"><strong>杀身体</strong><p>必须真正到身体、速度够、触球点高，才会稳定生成软球。</p></div><div class="card"><strong>快吊</strong><p>准备动作要像杀球，同时速度不能慢成舒服网前球。</p></div><div class="card"><strong>接发变化</strong><p>不同落点必须尽量共享准备动作。</p></div><div class="card"><strong>前场诱导</strong><p>拍头、身体中性和二次启动能力决定你能否大胆偏置。</p></div></div>`],
[4,'前场战术许可','前场激进程度必须跟上一拍同步',`<div class="prob"><div class="prow"><span class="rank">A球</span><div>明显压住：可以主动堵短线/中路并准备扑。</div></div><div class="prow"><span class="rank">B球</span><div>只有优势：偏置，不赌死。</div></div><div class="prow"><span class="rank">C/D球</span><div>回中性或转安全阵型。</div></div></div>`],
[4,'Pair Profile','职业档案不是“这个人弱”，而是条件化趋势',`<div class="grid"><div class="card"><strong>发接发</strong><p>不同落点下默认答案。</p></div><div class="card"><strong>防守</strong><p>被杀身体、直线、中路后的处理。</p></div><div class="card"><strong>轮转</strong><p>谁更常主动保护、谁越顶后慢。</p></div><div class="card"><strong>关键分</strong><p>压力下选择是否收缩。</p></div></div>`],
[4,'动态决策矩阵','实时信息永远优先于预设套路',`<div class="formula">当前球质 ＞ 当前身体姿态 ＞ 搭档实际位置 ＞ 稳定历史习惯 ＞ 预设套路</div><p class="lead">对手过去十次都挡直线，但这一拍他提前到位、拍面在前，你就不能还按历史习惯赌死。</p>`],
[4,'战术降级','高级球员最重要的能力之一是及时取消原计划',`<ul><li>A计划需要A级球；只打出B级，就把终结改成继续构建。</li><li>计划前压但搭档被动，就立即回中性。</li><li>计划变斜线但自己低点，就先安全过渡。</li></ul><div class="call">不会降级的人，懂越多高级套路反而越容易在错误条件下强行执行。</div>`],
[4,'职业训练闭环','把判断练成自动化，而不是比赛时背理论',`<ol><li>A/B/C/D报级训练。</li><li>视频暂停判断时间、击球点、姿态。</li><li>前场根据报级自动调整激进程度。</li><li>故意喂入低质量球，练“取消战术”。</li><li>半开放回合验证。</li></ol>`],

[5,'赛前 Scouting','比赛前先建立假设，不是假装已经知道答案',`<div class="grid"><div class="card"><strong>发接发</strong><p>两人各自发球稳定性、接发偏好和第三拍。</p></div><div class="card"><strong>攻防</strong><p>谁后场连续更强，谁防守更容易出软球。</p></div><div class="card"><strong>轮转</strong><p>弱点被打后，搭档如何保护。</p></div><div class="card"><strong>关键分</strong><p>压力下发/接/防守选择是否收缩。</p></div></div>`],
[5,'前6分测试','前6分不是急着赢，是低成本确认模型',`<ol><li>测试接发身体位。</li><li>测试两人中路责任。</li><li>测试其中一人被推后场后的默认线路。</li><li>测试连续杀身体后的防守出口。</li><li>观察被针对后搭档第一次保护。</li></ol><div class="call">测试用低风险球，不为了侦察送掉整局主动权。</div>`],
[5,'发接发矩阵','把四个人的前三拍关系画成矩阵',`<div class="tbl"><table><tr><th>对象</th><th>测试</th><th>观察</th></tr><tr><td>对方A接发</td><td>1/2/3/4/5/6</td><td>最稳定答案、最迟疑位置</td></tr><tr><td>对方B接发</td><td>同样测试</td><td>是否完全不同</td></tr><tr><td>我方A接发</td><td>选择最稳三种</td><td>对方第三拍怎么抓</td></tr><tr><td>我方B接发</td><td>选择最稳三种</td><td>搭档如何补下一拍</td></tr></table></div>`],
[5,'主攻对象','“打谁”不如“打什么结构”',`<p class="lead">不要只写“主攻A”。要写：A在被推反手后场、晚到时回直线概率明显增加；B会提前保护中路，所以第二层打B保护后的另一侧。</p><div class="formula">对象 + 条件 + 默认答案 + 搭档保护 = 可执行的主攻计划</div>`],
[5,'保护链与反保护','对方开始保护以后，主计划才真正进入第二层',`<div class="seq">压A → B保护 → 原本属于B的责任区变薄 → 攻击新空间 → 看A/B如何重新分工</div><div class="call">继续死打已经被保护的弱点，是比赛工程里最常见的低效。</div>`],
[5,'Plan A / B / C','一场比赛至少准备三种状态',`<div class="grid"><div class="card"><strong>Plan A</strong><p>我方状态正常时的主得分结构。</p></div><div class="card"><strong>Plan B</strong><p>对方已经解决A后的第二层。</p></div><div class="card"><strong>Plan C</strong><p>我方速度/手感下降时的低风险安全结构。</p></div><div class="card"><strong>退出条件</strong><p>明确什么时候不再继续某个计划。</p></div></div>`],
[5,'11分间歇','只校正模型，不重新发明整套战术',`<div class="seq">已确认模式 → 最大上游问题 → 一个调整 → 两人各自责任 → 下一分验证</div><p class="lead">间歇信息越少，执行率越高。不要一次讲发球、轮转、杀球、心态四件事。</p>`],
[5,'决胜局与关键分','决胜局管理的是风险和体能，不只是比分',`<ul><li>优先已经验证的发接发模式。</li><li>体能下降后减少高成本但低生成率的连续重杀。</li><li>关键分只使用训练过的责任协议。</li><li>如果对方改变保护，先确认两次再大改计划。</li></ul>`],
[5,'赛后验证','赛后必须区分“计划错”和“执行不到位”',`<div class="tbl"><table><tr><th>问题</th><th>判断</th></tr><tr><td>计划触发条件是否真的出现？</td><td>如果没出现，不能说计划失败</td></tr><tr><td>出现后技术质量够不够？</td><td>区分技术限制和战术错误</td></tr><tr><td>对方何时开始保护？</td><td>评估第二层是否太晚</td></tr><tr><td>关键分是否回到已验证模式？</td><td>看决策稳定性</td></tr></table></div>`],

[6,'Pair Identity','先回答：这对组合靠什么长期赢球？',`<p class="lead">不是“两个球员都很全面”就够了。组合必须有清晰、可重复的竞争身份。</p><div class="grid"><div class="card"><strong>前三拍型</strong><p>靠发接发和第四拍快速建立主动。</p></div><div class="card"><strong>连续后场型</strong><p>靠稳定压迫制造前场机会。</p></div><div class="card"><strong>平抽型</strong><p>靠中前场速度和身体压迫。</p></div><div class="card"><strong>防反型</strong><p>靠高质量防守转主动。</p></div></div>`],
[6,'角色模型','角色不是前/后，而是功能',`<ul><li>谁更擅长制造第一拍优势？</li><li>谁更擅长前场二次启动？</li><li>谁连续后场质量更稳定？</li><li>谁关键分接发更可靠？</li><li>谁在被针对时更能维持安全球质量？</li></ul>`],
[6,'技术限制链','战术做不到要一直追到真正限制因素',`<div class="formula">战术失败 → 球质问题？ → 技术动作？ → 击球点？ → 移动到位？ → 第一启动/制动？ → 体能？</div><div class="call">不要把“做不到”误判成“不懂战术”。</div>`],
[6,'移动与反应效率','高速男双的移动目标是更早形成可击球姿态',`<div class="grid"><div class="card"><strong>第一步</strong><p>对手触球时机与分腿是否匹配。</p></div><div class="card"><strong>制动</strong><p>到位后能否稳定触球，而不是冲过头。</p></div><div class="card"><strong>恢复</strong><p>击球后的第一步是否直接进入下一责任区。</p></div><div class="card"><strong>二次启动</strong><p>前场偏置后是否还能处理反方向。</p></div></div>`],
[6,'体能与负荷','连续跳杀不是越多越职业',`<ul><li>统计高强度后场动作后球质下降点。</li><li>平抽高密度训练同时看拍头高度和决策。</li><li>比赛周减少无意义疲劳，保持速度质量。</li><li>连续比赛时Plan C必须真实可用。</li></ul>`],
[6,'沟通与责任协议','高水平默契是提前约定，不是靠喊',`<div class="tbl"><table><tr><th>场景</th><th>协议</th></tr><tr><td>中路防守</td><td>谁优先、特殊情况下如何让</td></tr><tr><td>前场被越顶</td><td>谁处理、谁补后场/前场</td></tr><tr><td>B/C级下压</td><td>前场偏多少</td></tr><tr><td>关键分接发</td><td>首选方案与失败后的安全结构</td></tr></table></div>`],
[6,'组合 KPI','指标要服务比赛结构',`<ul><li>前三拍获得主动的比例。</li><li>杀球后生成低回球的比例。</li><li>前场站位与球质匹配率。</li><li>防守转中性/主动的成功率。</li><li>中路责任失误。</li><li>关键分使用已验证模式的执行率。</li></ul>`],
[6,'训练周期化','不同阶段解决不同问题',`<div class="grid"><div class="card"><strong>基础期</strong><p>技术质量、责任协议、体能底座。</p></div><div class="card"><strong>专项期</strong><p>主得分结构和限制条件训练。</p></div><div class="card"><strong>赛前期</strong><p>速度、前三拍、对手专项和关键分。</p></div><div class="card"><strong>比赛期</strong><p>维持质量、恢复、少量高价值调整。</p></div></div>`],
[6,'对手库与长期闭环','把每一场比赛变成下一次更快的识别',`<div class="formula">比赛录像 → Pair Profile → 训练验证 → 下一次交手 → 更新模型</div><p class="lead">长期数据库记录条件化趋势，不记录“这个人就一定这样打”的绝对标签。</p>`]
];
const menus=document.getElementById('menus'),sel=document.getElementById('sel'),content=document.getElementById('content');let cur=0;let lastL=0;C.forEach((c,i)=>{if(c[0]!==lastL){lastL=c[0];const t=document.createElement('div');t.className='level-title';t.textContent=`L${c[0]} · ${['','基础结构','中高级战术','高级比赛阅读','国际职业决策','比赛工程','高性能组合'][c[0]]}`;menus.appendChild(t)}const wrap=document.createElement('div');wrap.className='menu';const b=document.createElement('button');b.innerHTML=`<span class="badge">L${c[0]}-${String(C.filter((x,j)=>j<=i&&x[0]===c[0]).length).padStart(2,'0')}</span><span>${c[1]}</span>`;b.onclick=()=>show(i,true);wrap.appendChild(b);menus.appendChild(wrap);const o=document.createElement('option');o.value=i;o.textContent=`L${c[0]} · ${c[1]}`;sel.appendChild(o);const s=document.createElement('section');s.className='chapter';s.innerHTML=`<div class="k">L${c[0]} · ${c[1]}</div><h2>${c[2]}</h2>${c[3]}`;content.appendChild(s)});const nav=document.createElement('div');nav.className='nav';nav.innerHTML='<button id="prev">← 上一章</button><button id="next">下一章 →</button>';content.appendChild(nav);const secs=[...document.querySelectorAll('.chapter')],btns=[...document.querySelectorAll('.menu button')],prev=document.getElementById('prev'),next=document.getElementById('next');function show(i,push=false){cur=Math.max(0,Math.min(C.length-1,i));secs.forEach((s,n)=>s.classList.toggle('active',n===cur));btns.forEach((b,n)=>b.classList.toggle('active',n===cur));sel.value=cur;prev.disabled=cur===0;next.disabled=cur===C.length-1;if(push)history.replaceState(null,'',`#l${C[cur][0]}-c${C.filter((x,j)=>j<=cur&&x[0]===C[cur][0]).length}`);scrollTo({top:0,behavior:'smooth'})}sel.onchange=()=>show(+sel.value,true);prev.onclick=()=>show(cur-1,true);next.onclick=()=>show(cur+1,true);const m=location.hash.match(/l(\d)-c(\d+)/);if(m){const l=+m[1],n=+m[2];const ids=C.map((x,i)=>x[0]===l?i:null).filter(x=>x!==null);show(ids[Math.max(0,n-1)]??0,false)}else show(0,false);
</script></body></html>
