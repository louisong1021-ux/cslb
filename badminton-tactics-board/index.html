<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>羽毛球战术板</title>
<style>
  :root{
    --bg:#0a0f18; --panel:#111927; --panel2:#162235; --text:#f4f7fb; --muted:#8ea0b7;
    --line:#2a3950; --accent:#72f2b1; --accent2:#43c8ff; --danger:#ff6b6b;
    --court:#0f7350; --court2:#0d6848; --court-line:#f8fbf6; --shadow:0 18px 60px rgba(0,0,0,.32);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  body{overflow:hidden}
  button,input,select{font:inherit}
  button{border:0}
  .app{height:100%;display:grid;grid-template-columns:300px minmax(0,1fr);background:
    radial-gradient(circle at 75% 10%, rgba(67,200,255,.08), transparent 30%),
    radial-gradient(circle at 20% 90%, rgba(114,242,177,.07), transparent 28%),var(--bg)}
  .sidebar{height:100%;padding:22px 18px;border-right:1px solid rgba(255,255,255,.06);background:rgba(12,18,29,.86);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:18px;overflow:auto}
  .brand{display:flex;align-items:center;gap:12px;padding:2px 4px 10px}
  .brandmark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;box-shadow:0 8px 24px rgba(67,200,255,.2)}
  .brandmark svg{width:23px;height:23px;color:#07121a}
  h1{font-size:18px;line-height:1.2;margin:0;font-weight:760;letter-spacing:.1px}
  .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .section{display:flex;flex-direction:column;gap:9px}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#7f91aa;font-weight:700;padding:0 4px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:#0b1220;border:1px solid rgba(255,255,255,.07);padding:4px;border-radius:12px;gap:4px}
  .seg.three{grid-template-columns:repeat(3,1fr)}
  .seg button{height:38px;border-radius:9px;color:#a9b7c8;background:transparent;cursor:pointer;font-weight:700;font-size:13px}
  .seg button.active{background:var(--panel2);color:white;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
  .formation-panel{padding:12px;border-radius:13px;background:linear-gradient(135deg,rgba(114,242,177,.07),rgba(67,200,255,.06));border:1px solid rgba(114,242,177,.14)}
  .preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
  .preset{min-height:43px;padding:6px 7px;border-radius:9px;background:#101a2a;color:#bdcad9;border:1px solid rgba(255,255,255,.07);cursor:pointer;font-size:11px;font-weight:750;line-height:1.2;text-align:left;transition:.16s ease}
  .preset:hover{border-color:rgba(114,242,177,.38);color:#e5fff1;background:rgba(114,242,177,.09)}
  .preset.active{border-color:rgba(114,242,177,.52);color:#e5fff1;background:rgba(114,242,177,.13);box-shadow:inset 0 0 0 1px rgba(114,242,177,.08)}
  .preset strong{display:block;font-size:11.5px}.preset span{display:block;margin-top:3px;color:#7790a9;font-size:9.5px;font-weight:650}
  .preset-note{min-height:31px;font-size:10.5px;color:#8fa1b8;line-height:1.48;padding:1px 2px 0}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tool{height:46px;border-radius:11px;background:#101a2a;color:#b8c5d6;border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:13px;font-weight:700;transition:.16s ease}
  .tool:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.13)}
  .tool.active{background:rgba(114,242,177,.12);border-color:rgba(114,242,177,.46);color:#caffdf}
  .tool svg{width:17px;height:17px}
  .tool.shot.active{background:rgba(67,200,255,.12);border-color:rgba(67,200,255,.44);color:#c4efff}
  .tool.erase.active{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.42);color:#ffd0d0}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .action{height:40px;border-radius:10px;background:#111b2a;color:#d6deea;border:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
  .action:hover{border-color:rgba(255,255,255,.14)}
  .action.primary{background:linear-gradient(135deg,rgba(114,242,177,.18),rgba(67,200,255,.14));border-color:rgba(114,242,177,.28)}
  .action.danger{color:#ffb1b1}
  .action svg{width:15px;height:15px}
  .help{font-size:12px;line-height:1.65;color:#8ea0b7;padding:12px 13px;background:#0d1522;border:1px solid rgba(255,255,255,.05);border-radius:12px}
  .help b{color:#cbd5e1}
  .sidebar-footer{margin-top:auto;font-size:11px;color:#64758d;text-align:center;padding-top:4px}
  .workspace{min-width:0;height:100%;display:flex;flex-direction:column}
  .topbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.055);background:rgba(9,14,23,.52);backdrop-filter:blur(14px)}
  .titlewrap{display:flex;align-items:center;gap:12px;min-width:0}
  .board-title{font-size:16px;font-weight:760;white-space:nowrap}
  .status{font-size:12px;color:#7f91a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top-actions{display:flex;gap:8px}
  .topbtn{height:38px;padding:0 13px;border-radius:10px;background:#111b2a;color:#d2dcea;border:1px solid rgba(255,255,255,.06);cursor:pointer;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
  .topbtn svg{width:15px;height:15px}
  .stage{flex:1;min-height:0;padding:22px;display:grid;place-items:center;overflow:auto}
  .board-shell{position:relative;width:min(76vw, 850px);aspect-ratio:1.55/1;border-radius:24px;padding:18px;background:linear-gradient(180deg,#142033,#0f1725);box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.08)}
  .board{width:100%;height:100%;position:relative;border-radius:14px;overflow:hidden;background:
     radial-gradient(circle at 50% 50%,rgba(255,255,255,.025),transparent 35%),
     repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 7px),
     linear-gradient(135deg,var(--court),var(--court2));cursor:crosshair;touch-action:none;user-select:none}
  .board.move-mode{cursor:default}
  .court-svg,.draw-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .draw-svg{z-index:4}
  .court-svg{z-index:1}
  .court-svg line,.court-svg rect{vector-effect:non-scaling-stroke}
  .net-shadow{position:absolute;left:50%;top:0;bottom:0;width:6px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.16),transparent);z-index:2;pointer-events:none}
  .center-label{position:absolute;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-90deg);font-size:11px;letter-spacing:.28em;color:rgba(255,255,255,.24);font-weight:900;pointer-events:none}
  .marker{position:absolute;z-index:8;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%);cursor:grab;font-weight:900;font-size:14px;border:3px solid rgba(255,255,255,.94);box-shadow:0 8px 18px rgba(0,0,0,.28), inset 0 0 0 2px rgba(0,0,0,.06);touch-action:none}
  .marker:active{cursor:grabbing}
  .marker.red{background:#ff5c61;color:white}
  .marker.blue{background:#3d88ff;color:white}
  .marker.mixed-role{font-size:19px}
  .marker.mixed-role::after{content:attr(data-role);position:absolute;left:50%;top:-13px;transform:translateX(-50%);min-width:25px;height:17px;padding:0 5px;border-radius:8px;display:grid;place-items:center;background:rgba(7,13,21,.88);border:1px solid rgba(255,255,255,.18);color:#eef5ff;font-size:9px;font-weight:800;line-height:1;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.18)}
  .marker.ghost{opacity:.28}
  .marker.hidden{display:none}
  .shuttle{position:absolute;z-index:9;width:35px;height:35px;transform:translate(-50%,-50%);display:grid;place-items:center;cursor:grab;touch-action:none;filter:drop-shadow(0 5px 8px rgba(0,0,0,.3))}
  .shuttle svg{width:31px;height:31px}
  .legend{position:absolute;right:28px;bottom:22px;z-index:10;display:flex;gap:13px;align-items:center;background:rgba(7,13,21,.62);padding:7px 10px;border-radius:10px;backdrop-filter:blur(8px);font-size:10px;color:#d1d8e2;pointer-events:none}
  .legend span{display:flex;align-items:center;gap:5px}
  .dot{width:7px;height:7px;border-radius:50%}.redDot{background:#ff5c61}.blueDot{background:#3d88ff}
  .phase-badge{position:absolute;left:50%;top:10px;z-index:7;transform:translateX(-50%);padding:5px 9px;border-radius:9px;background:rgba(7,13,21,.68);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);color:#d9e5f3;font-size:9.5px;font-weight:800;letter-spacing:.04em;pointer-events:none;white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);padding:10px 14px;border-radius:10px;background:#172438;color:#dbe7f5;border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 44px rgba(0,0,0,.35);font-size:12px;font-weight:650;opacity:0;pointer-events:none;transition:.2s ease;z-index:30}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:900px){
    body{overflow:auto}.app{height:auto;min-height:100%;grid-template-columns:1fr}.sidebar{height:auto;border-right:0;border-bottom:1px solid rgba(255,255,255,.06);padding:15px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}.brand,#formationPanel{grid-column:1/-1}.help,.sidebar-footer{display:none}.workspace{height:auto;min-height:70vh}.topbar{height:62px;padding:0 14px}.status{display:none}.stage{padding:12px;min-height:540px}.board-shell{width:min(96vw,820px);padding:10px;border-radius:18px}.top-actions .topbtn span{display:none}.topbtn{width:38px;padding:0;justify-content:center}}
  @media(max-width:560px){.sidebar{grid-template-columns:1fr}.stage{min-height:0;place-items:start center;padding-top:18px}.marker{width:36px;height:36px;font-size:11px;border-width:2px}.legend{display:none}.board-shell{width:98vw;padding:7px;border-radius:14px}.top-actions .topbtn span{display:inline}.topbtn{width:auto;padding:0 8px;font-size:11px}.topbar{gap:8px}.board-title{font-size:14px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brandmark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 5c2.7 1.2 5.1 3.4 6.8 6.2M4 9c3 .7 5.9 2.3 8.2 4.6M10.5 3.5c2.1 1.7 3.8 4 4.9 6.6"/><path d="M13 14.1 20.4 21M12.1 14.9l2.1-2.1a2.2 2.2 0 0 1 3.1 0l.1.1a2.2 2.2 0 0 1 0 3.1l-2.1 2.1-3.2-3.2Z"/></svg>
      </div>
      <div><h1>羽毛球战术板</h1><div class="sub">Badminton Tactics Board</div></div>
    </div>

    <div class="section">
      <div class="label">比赛模式</div>
      <div class="seg three" id="matchMode">
        <button class="active" data-mode="doubles">双打</button><button data-mode="mixed">混双</button><button data-mode="singles">单打</button>
      </div>
    </div>

    <div class="section formation-panel" id="formationPanel">
      <div class="label" id="formationLabel">双打比赛站位</div>
      <div class="preset-grid" id="formationGrid"></div>
      <div class="preset-note" id="formationNote">根据球路切换站位；预设是回合中的参考起点，不是固定站死。</div>
    </div>

    <div class="section">
      <div class="label">绘制工具</div>
      <div class="tools">
        <button class="tool active" data-tool="move"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/><path d="m8 6 4-4 4 4M18 8l4 4-4 4M16 18l-4 4-4-4M6 16l-4-4 4-4"/></svg>移动</button>
        <button class="tool" data-tool="run"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18c4-8 8-8 16-12"/><path d="m15 4 5 2-2 5"/></svg>跑位线</button>
        <button class="tool shot" data-tool="shot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20 20 3"/><path d="M13 3h7v7"/></svg>击球线</button>
        <button class="tool erase" data-tool="erase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 15 8-8 6 6-8 8H3v-6Z"/><path d="m14 4 6 6"/></svg>擦除</button>
      </div>
    </div>

    <div class="section compact">
      <div class="label">编辑</div>
      <div class="row">
        <button class="action" id="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 7 4 12l5 5"/><path d="M4 12h8a7 7 0 1 1 0 14"/></svg>撤销</button>
        <button class="action danger" id="clearLines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>清线</button>
      </div>
      <div class="row">
        <button class="action" id="reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0 2 5"/><path d="M20 4v7h-7"/></svg>重置</button>
        <button class="action primary" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h12l4 4v14H5V3Z"/><path d="M8 3v6h8V3M8 21v-8h8v8"/></svg>保存</button>
      </div>
    </div>

    <div class="help"><b>使用方法</b><br>“移动”模式可拖动球员和羽毛球。选择“跑位线”或“击球线”后，在球场上按住并拖动即可画箭头。点击“擦除”后再点某条箭头即可删除。</div>
    <div class="sidebar-footer">战术会保存在当前浏览器中</div>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div class="titlewrap"><div class="board-title">战术 01</div><div class="status" id="status">移动球员，开始布置站位</div></div>
      <div class="top-actions">
        <button class="topbtn" id="load"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span>载入</span></button>
        <button class="topbtn" id="importBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9M7 14l5-5 5 5"/><path d="M5 3h14"/></svg><span>导入</span></button>
        <button class="topbtn" id="download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span>导出</span></button>
        <input type="file" id="fileInput" accept="application/json" hidden />
      </div>
    </header>

    <section class="stage">
      <div class="board-shell">
        <div class="board move-mode" id="board">
          <div class="phase-badge" id="phaseBadge">双打 · 准备站位</div>
          <svg class="court-svg" viewBox="0 0 1340 610" preserveAspectRatio="none" aria-hidden="true">
            <rect x="55" y="55" width="1230" height="500" rx="3" fill="none" stroke="var(--court-line)" stroke-width="3"/>
            <line x1="55" y1="103" x2="1285" y2="103" stroke="var(--court-line)" stroke-width="2.4" opacity=".96"/>
            <line x1="55" y1="507" x2="1285" y2="507" stroke="var(--court-line)" stroke-width="2.4" opacity=".96"/>
            <line x1="670" y1="55" x2="670" y2="555" stroke="var(--court-line)" stroke-width="4"/>
            <line x1="452" y1="55" x2="452" y2="555" stroke="var(--court-line)" stroke-width="2.4"/>
            <line x1="888" y1="55" x2="888" y2="555" stroke="var(--court-line)" stroke-width="2.4"/>
            <line x1="145" y1="55" x2="145" y2="555" stroke="var(--court-line)" stroke-width="2.1"/>
            <line x1="1195" y1="55" x2="1195" y2="555" stroke="var(--court-line)" stroke-width="2.1"/>
            <line x1="55" y1="305" x2="452" y2="305" stroke="var(--court-line)" stroke-width="2.4"/>
            <line x1="888" y1="305" x2="1285" y2="305" stroke="var(--court-line)" stroke-width="2.4"/>
            <line id="singleTop" x1="55" y1="103" x2="1285" y2="103" stroke="#72f2b1" stroke-width="6" opacity="0"/>
            <line id="singleBottom" x1="55" y1="507" x2="1285" y2="507" stroke="#72f2b1" stroke-width="6" opacity="0"/>
          </svg>
          <div class="net-shadow"></div><div class="center-label">NET</div>
          <svg class="draw-svg" id="drawSvg" viewBox="0 0 1000 600" preserveAspectRatio="none">
            <defs>
              <marker id="arrowRun" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#72f2b1"/></marker>
              <marker id="arrowShot" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#43c8ff"/></marker>
            </defs>
          </svg>
          <div class="marker red" data-id="r1" style="left:35%;top:31%">R1</div>
          <div class="marker red" data-id="r2" style="left:35%;top:69%">R2</div>
          <div class="marker blue" data-id="b1" style="left:65%;top:31%">B1</div>
          <div class="marker blue" data-id="b2" style="left:65%;top:69%">B2</div>
          <div class="shuttle" data-id="shuttle" style="left:50%;top:50%" title="羽毛球">
            <svg viewBox="0 0 40 40"><g fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M9 4 25 20M16 3l12 14M4 10l17 15M8 4h8l12 13-7 8L4 10l4-6Z"/><path d="m21 25 4 4"/></g><circle cx="28.5" cy="31.5" r="5.5" fill="#f7e85c" stroke="#fff" stroke-width="2"/></svg>
          </div>
          <div class="legend"><span><i class="dot redDot"></i>己方</span><span><i class="dot blueDot"></i>对方</span></div>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
  const board = document.getElementById('board');
  const drawSvg = document.getElementById('drawSvg');
  const statusEl = document.getElementById('status');
  const toastEl = document.getElementById('toast');
  const boardTitle = document.querySelector('.board-title');
  const formationLabel = document.getElementById('formationLabel');
  const formationGrid = document.getElementById('formationGrid');
  const formationNote = document.getElementById('formationNote');
  const phaseBadge = document.getElementById('phaseBadge');
  const modeButtons = [...document.querySelectorAll('#matchMode button')];
  const toolButtons = [...document.querySelectorAll('[data-tool]')];
  const markers = [...document.querySelectorAll('.marker,.shuttle')];
  const players = [...document.querySelectorAll('.marker')];
  let mode = 'doubles', tool = 'move', dragTarget = null, drawing = false, draft = null;
  let lines = [], history = [], activeFormation = 'doublesReady';

  const modeNames={doubles:'双打',mixed:'混双',singles:'单打'};
  const defaultFormations={doubles:'doublesReady',mixed:'mixedAttack',singles:'singlesBase'};
  const formationCatalog={
    doubles:[
      {id:'doublesReady',label:'准备站位',short:'中场错位',description:'双方在中前场略微错位，拍头向上；这是攻防转换的准备位置，不是左右并排站死。',positions:{r1:['31%','36%'],r2:['28%','67%'],b1:['69%','64%'],b2:['72%','33%'],shuttle:['50%','50%']},lines:[]},
      {id:'doublesServe',label:'短发接发',short:'抢前三拍',description:'发球员贴近短发球线和中线，搭档在后方覆盖第三拍；接发员前压，搭档防备偷后场。',positions:{r1:['31.5%','44%'],r2:['19%','64%'],b1:['68.5%','56%'],b2:['82%','36%'],shuttle:['31.7%','44%']},lines:[{type:'shot',x1:317,y1:264,x2:675,y2:328}]},
      {id:'doublesAttack',label:'前后进攻',short:'后杀前封',description:'后场队员保持下压，前场队员站在发球线前后寻找封网；对方回到平行防守。',positions:{r1:['41.5%','52%'],r2:['16.5%','34%'],b1:['77%','33%'],b2:['77%','68%'],shuttle:['16.5%','34%']},lines:[{type:'shot',x1:170,y1:204,x2:742,y2:205},{type:'run',x1:415,y1:312,x2:430,y2:245}]},
      {id:'doublesDefense',label:'平行防守',short:'各守半区',description:'面对后场下压时两人平行、略后于中场，各守半区；直线防守者可稍靠前，另一人补中路。',positions:{r1:['22%','32%'],r2:['22%','68%'],b1:['58.5%','50%'],b2:['83%','32%'],shuttle:['83%','32%']},lines:[{type:'shot',x1:830,y1:192,x2:235,y2:205}]},
      {id:'doublesDrive',label:'平抽挡',short:'中场轮转',description:'平抽挡时保持中场错位和拍头在前，击球者压上、搭档补身后，随球路快速轮转。',positions:{r1:['33%','35%'],r2:['29%','68%'],b1:['67%','65%'],b2:['71%','32%'],shuttle:['52%','50%']},lines:[{type:'shot',x1:500,y1:300,x2:675,y2:390},{type:'run',x1:290,y1:408,x2:350,y2:345}]}
    ],
    mixed:[
      {id:'mixedServe',label:'女发球',short:'男搭档后压',description:'女队员在T位附近短发，男队员后置准备第三拍；对方女队员前压接发，男队员覆盖后场。',positions:{r1:['31.5%','44%'],r2:['19%','64%'],b1:['68.5%','56%'],b2:['82%','36%'],shuttle:['31.7%','44%']},lines:[{type:'shot',x1:317,y1:264,x2:675,y2:328}]},
      {id:'mixedMaleServe',label:'男发球',short:'女搭档封网',description:'男队员短发，女搭档压低重心站在前侧准备封网，但必须让接发者清楚看到发球动作和羽毛球。',positions:{r1:['38%','59%'],r2:['31.5%','44%'],b1:['68.5%','56%'],b2:['82%','35%'],shuttle:['31.7%','44%']},lines:[{type:'shot',x1:317,y1:264,x2:675,y2:328},{type:'run',x1:380,y1:354,x2:430,y2:340}]},
      {id:'mixedReceive',label:'己方接发',short:'女前男后',description:'女队员靠近短发球线抢推、扑、放，男队员在后方覆盖偷后场，并准备接第四拍。',positions:{r1:['31.5%','56%'],r2:['18%','34%'],b1:['68.5%','44%'],b2:['81%','64%'],shuttle:['68.3%','44%']},lines:[{type:'shot',x1:683,y1:264,x2:325,y2:328}]},
      {id:'mixedAttack',label:'前后进攻',short:'女前男后',description:'常用进攻为女队员控制网前和中前场、男队员覆盖中后场；防守方女队员站在来球斜线，男队员守直线。',positions:{r1:['41.5%','53%'],r2:['16.5%','34%'],b1:['76%','68%'],b2:['76%','32%'],shuttle:['16.5%','34%']},lines:[{type:'shot',x1:170,y1:204,x2:735,y2:200},{type:'run',x1:415,y1:318,x2:438,y2:255}]},
      {id:'mixedDefense',label:'平行防守',short:'女守斜线',description:'混双防守仍以平行为主：男队员通常守来球直线，女队员守斜线并可略靠前，便于挡网后转入进攻。',positions:{r1:['24.5%','68%'],r2:['22%','32%'],b1:['58.5%','49%'],b2:['84%','32%'],shuttle:['84%','32%']},lines:[{type:'shot',x1:840,y1:192,x2:235,y2:202},{type:'run',x1:245,y1:408,x2:385,y2:345}]},
      {id:'mixedTransition',label:'挡网轮转',short:'防守转进攻',description:'挡网质量足够时，前压者跟进封网，搭档回中后场补位。实际轮转由击球点决定，不应只按性别固定。',positions:{r1:['40%','59%'],r2:['25%','36%'],b1:['60%','43%'],b2:['82%','67%'],shuttle:['52%','58%']},lines:[{type:'run',x1:400,y1:354,x2:458,y2:342},{type:'run',x1:250,y1:216,x2:285,y2:300},{type:'shot',x1:520,y1:348,x2:610,y2:275}]}
    ],
    singles:[
      {id:'singlesBase',label:'基本中心',short:'按回球微调',description:'单打中心不是几何死点，而是根据自己的回球方向、对手击球点和下一拍威胁做小幅前后左右调整。',positions:{r1:['27.5%','50%'],r2:['35%','69%'],b1:['72.5%','50%'],b2:['65%','69%'],shuttle:['50%','50%']},lines:[]},
      {id:'singlesServe',label:'发接发',short:'靠近T位',description:'发球与接发都靠近T位并站在合法发球区内；发完立即分腿启动，准备封网或回到中心。',positions:{r1:['30.5%','44%'],r2:['35%','69%'],b1:['69.5%','56%'],b2:['65%','69%'],shuttle:['30.7%','44%']},lines:[{type:'shot',x1:307,y1:264,x2:685,y2:328}]},
      {id:'singlesAttack',label:'后场进攻',short:'击球后回中',description:'从后场进攻后不要停在底线，应沿最短路线恢复到偏向对手可能直线回球的一侧中心。',positions:{r1:['14%','34%'],r2:['35%','69%'],b1:['76%','50%'],b2:['65%','69%'],shuttle:['14%','34%']},lines:[{type:'shot',x1:140,y1:204,x2:905,y2:410},{type:'run',x1:145,y1:215,x2:275,y2:300}]},
      {id:'singlesDefense',label:'防守中心',short:'向直线侧偏移',description:'对手在后场进攻时，中心向其直线下压一侧略偏并适度后撤，同时保留扑网和斜线救球空间。',positions:{r1:['20%','42%'],r2:['35%','69%'],b1:['86%','34%'],b2:['65%','69%'],shuttle:['86%','34%']},lines:[{type:'shot',x1:860,y1:204,x2:220,y2:250}]},
      {id:'singlesNet',label:'网前后恢复',short:'先稳再回中',description:'完成网前球后先观察对手是否被迫挑球，再后撤到可覆盖直线推球与后场的中心位置。',positions:{r1:['42%','58%'],r2:['35%','69%'],b1:['72%','46%'],b2:['65%','69%'],shuttle:['46%','58%']},lines:[{type:'run',x1:420,y1:348,x2:275,y2:300}]}
    ]
  };

  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  function announce(msg){statusEl.textContent=msg;toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(announce.t);announce.t=setTimeout(()=>toastEl.classList.remove('show'),1500)}
  function pointFromEvent(e,courtOnly=false){
    const r=board.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*1000,y=(e.clientY-r.top)/r.height*600;
    if(courtOnly){x=clamp(x,42,958);y=clamp(y,mode==='singles'?102:54,mode==='singles'?498:546)}
    else{x=clamp(x,0,1000);y=clamp(y,0,600)}
    return {x,y,px:x/10,py:y/6};
  }
  function markerPointFromEvent(e,marker){
    const p=pointFromEvent(e),isShuttle=marker.classList.contains('shuttle'),isRed=marker.dataset.id.startsWith('r');
    const yMin=mode==='singles'?17.2:9.3,yMax=mode==='singles'?82.8:90.7;
    const xMin=isShuttle?4.2:(isRed?5.5:51.5),xMax=isShuttle?95.8:(isRed?48.5:94.5);
    return {px:clamp(p.px,xMin,xMax),py:clamp(p.py,yMin,yMax)};
  }
  function snapshot(){return {mode,formation:activeFormation,lines:JSON.parse(JSON.stringify(lines)),positions:Object.fromEntries(markers.map(m=>[m.dataset.id,{left:m.style.left,top:m.style.top}]))};}
  function pushHistory(){history.push(snapshot());if(history.length>40)history.shift();}
  function renderLines(){
    drawSvg.querySelectorAll('.tactic-line').forEach(n=>n.remove());
    lines.forEach((l,i)=>{
      const el=document.createElementNS('http://www.w3.org/2000/svg','line');
      el.classList.add('tactic-line');el.dataset.index=i;
      el.setAttribute('x1',l.x1);el.setAttribute('y1',l.y1);el.setAttribute('x2',l.x2);el.setAttribute('y2',l.y2);
      el.setAttribute('stroke',l.type==='run'?'#72f2b1':'#43c8ff');
      el.setAttribute('stroke-width',l.type==='run'?'6':'5');
      el.setAttribute('stroke-linecap','round');
      if(l.type==='run')el.setAttribute('stroke-dasharray','14 10');
      el.setAttribute('marker-end',l.type==='run'?'url(#arrowRun)':'url(#arrowShot)');
      el.style.pointerEvents = tool==='erase'?'stroke':'none';
      el.style.cursor = tool==='erase'?'pointer':'default';
      el.addEventListener('pointerdown',ev=>{if(tool!=='erase')return;ev.stopPropagation();pushHistory();lines.splice(i,1);markCustom();renderLines();announce('已删除箭头');});
      drawSvg.appendChild(el);
    });
  }
  function setTool(next){tool=next;toolButtons.forEach(b=>b.classList.toggle('active',b.dataset.tool===next));board.classList.toggle('move-mode',next==='move');renderLines();statusEl.textContent={move:'拖动球员或羽毛球',run:'按住拖动：绘制跑位箭头',shot:'按住拖动：绘制击球箭头',erase:'点击箭头即可擦除'}[next];}
  toolButtons.forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));

  function findFormation(id){return Object.values(formationCatalog).flat().find(item=>item.id===id)}
  function belongsToMode(id){return formationCatalog[mode].some(item=>item.id===id)}
  function setFormationMeta(id){
    const preset=findFormation(id),title=preset?`${modeNames[mode]} · ${preset.label}`:`${modeNames[mode]} · 自定义`;
    boardTitle.textContent=title;phaseBadge.textContent=title;
    formationNote.textContent=preset?preset.description:'已手动调整站位；球员会被限制在本方有效场区内，可继续绘制跑位和击球箭头。';
    [...formationGrid.querySelectorAll('[data-preset]')].forEach(b=>b.classList.toggle('active',b.dataset.preset===id));
  }
  function renderFormationButtons(){
    formationLabel.textContent=modeNames[mode]+'比赛站位';
    formationGrid.innerHTML=formationCatalog[mode].map(item=>`<button class="preset" data-preset="${item.id}"><strong>${item.label}</strong><span>${item.short}</span></button>`).join('');
    [...formationGrid.querySelectorAll('[data-preset]')].forEach(b=>b.addEventListener('click',()=>{
      pushHistory();applyFormation(b.dataset.preset);announce('已应用：'+findFormation(b.dataset.preset).label);
    }));
  }
  function markCustom(){if(activeFormation==='custom')return;activeFormation='custom';setFormationMeta('custom')}
  function updateModeUI(){
    const isSingles=mode==='singles',isMixed=mode==='mixed';
    if(activeFormation!=='custom'&&!belongsToMode(activeFormation))activeFormation=defaultFormations[mode];
    modeButtons.forEach(b=>{const active=b.dataset.mode===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
    document.querySelector('[data-id="r2"]').classList.toggle('hidden',isSingles);
    document.querySelector('[data-id="b2"]').classList.toggle('hidden',isSingles);
    document.getElementById('singleTop').setAttribute('opacity',isSingles?'.32':'0');
    document.getElementById('singleBottom').setAttribute('opacity',isSingles?'.32':'0');
    const mixedRoles={r1:['♀','女队员'],r2:['♂','男队员'],b1:['♀','女队员'],b2:['♂','男队员']};
    players.forEach(p=>{
      p.classList.toggle('mixed-role',isMixed);
      if(isMixed){p.textContent=mixedRoles[p.dataset.id][0];p.dataset.role=mixedRoles[p.dataset.id][1];p.title=mixedRoles[p.dataset.id][1];}
      else{p.textContent=p.dataset.id.toUpperCase();p.removeAttribute('data-role');p.title='球员 '+p.dataset.id.toUpperCase();}
    });
    renderFormationButtons();setFormationMeta(activeFormation);
  }
  function setMode(next,resetPositions=false){
    mode=next;activeFormation=defaultFormations[next];updateModeUI();
    if(resetPositions)applyFormation(activeFormation);
    announce({singles:'已切换为单打，使用单打有效边线',doubles:'已切换为双打，可选择真实比赛阶段',mixed:'已切换为混双，包含发接发和攻防轮转'}[next]);
  }
  modeButtons.forEach(b=>b.addEventListener('click',()=>{if(b.dataset.mode===mode)return;pushHistory();setMode(b.dataset.mode,true)}));

  markers.forEach(m=>{
    m.addEventListener('pointerdown',e=>{if(tool!=='move')return;e.preventDefault();pushHistory();dragTarget=m;m.setPointerCapture?.(e.pointerId);});
    m.addEventListener('pointermove',e=>{if(dragTarget!==m)return;const p=markerPointFromEvent(e,m);m.style.left=p.px+'%';m.style.top=p.py+'%';markCustom();});
    m.addEventListener('pointerup',()=>{if(dragTarget===m){dragTarget=null;statusEl.textContent='站位已更新（有效场区限制已开启）';}});
  });

  board.addEventListener('pointerdown',e=>{
    if(!['run','shot'].includes(tool) || e.target.closest('.marker,.shuttle')) return;
    e.preventDefault();pushHistory();drawing=true;const p=pointFromEvent(e,true);
    draft=document.createElementNS('http://www.w3.org/2000/svg','line');draft.classList.add('tactic-line');
    draft.setAttribute('x1',p.x);draft.setAttribute('y1',p.y);draft.setAttribute('x2',p.x);draft.setAttribute('y2',p.y);
    draft.setAttribute('stroke',tool==='run'?'#72f2b1':'#43c8ff');draft.setAttribute('stroke-width',tool==='run'?'6':'5');draft.setAttribute('stroke-linecap','round');
    if(tool==='run')draft.setAttribute('stroke-dasharray','14 10');
    draft.setAttribute('marker-end',tool==='run'?'url(#arrowRun)':'url(#arrowShot)');drawSvg.appendChild(draft);board.setPointerCapture?.(e.pointerId);
  });
  board.addEventListener('pointermove',e=>{if(!drawing||!draft)return;const p=pointFromEvent(e,true);draft.setAttribute('x2',p.x);draft.setAttribute('y2',p.y);});
  board.addEventListener('pointerup',e=>{
    if(!drawing||!draft)return;const p=pointFromEvent(e,true);const x1=+draft.getAttribute('x1'),y1=+draft.getAttribute('y1');
    const len=Math.hypot(p.x-x1,p.y-y1);draft.remove();draft=null;drawing=false;
    if(len>18){lines.push({type:tool,x1,y1,x2:p.x,y2:p.y});markCustom();renderLines();statusEl.textContent=tool==='run'?'跑位线已添加':'击球线已添加';} else history.pop();
  });

  function applyFormation(name){
    const preset=findFormation(name);if(!preset)return;
    markers.forEach(m=>{const p=preset.positions[m.dataset.id];if(p){m.style.left=p[0];m.style.top=p[1];}});
    lines=JSON.parse(JSON.stringify(preset.lines||[]));activeFormation=name;renderLines();setFormationMeta(name);
  }
  function resetDefaultPositions(){applyFormation(defaultFormations[mode])}
  document.getElementById('undo').addEventListener('click',()=>{const s=history.pop();if(!s)return announce('没有可撤销的操作');applyState(s);announce('已撤销');});
  document.getElementById('clearLines').addEventListener('click',()=>{if(!lines.length)return;pushHistory();lines=[];markCustom();renderLines();announce('已清除所有箭头');});
  document.getElementById('reset').addEventListener('click',()=>{pushHistory();resetDefaultPositions();announce('已恢复当前模式的真实比赛基准站位');});

  function applyState(s){
    mode=['singles','doubles','mixed'].includes(s.mode)?s.mode:'doubles';
    activeFormation=s.formation&&belongsToSavedMode(s.formation,mode)?s.formation:'custom';updateModeUI();
    Object.entries(s.positions||{}).forEach(([id,p])=>{const m=document.querySelector(`[data-id="${id}"]`);if(m){m.style.left=p.left;m.style.top=p.top;}});
    lines=Array.isArray(s.lines)?s.lines:[];renderLines();setFormationMeta(activeFormation);
  }
  function belongsToSavedMode(id,savedMode){return formationCatalog[savedMode].some(item=>item.id===id)}
  function currentPayload(){return {version:3,name:'羽毛球战术',savedAt:new Date().toISOString(),...snapshot()};}
  document.getElementById('save').addEventListener('click',()=>{localStorage.setItem('badminton-tactics-board',JSON.stringify(currentPayload()));announce('已保存到浏览器');});
  document.getElementById('load').addEventListener('click',()=>{const raw=localStorage.getItem('badminton-tactics-board');if(!raw)return announce('暂无已保存战术');try{pushHistory();applyState(JSON.parse(raw));announce('已载入战术');}catch{announce('保存数据无法读取')}});
  document.getElementById('download').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(currentPayload(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='badminton-tactic.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);announce('战术文件已导出');});
  const fileInput=document.getElementById('fileInput');
  document.getElementById('importBtn').addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',async()=>{const f=fileInput.files[0];if(!f)return;try{const data=JSON.parse(await f.text());pushHistory();applyState(data);announce('战术文件已导入');}catch{announce('文件格式不正确')}finally{fileInput.value='';}});

  // Keyboard shortcuts: V move, R run, S shot, E erase, Ctrl/Cmd+Z undo
  addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();document.getElementById('undo').click();return;}const map={v:'move',r:'run',s:'shot',e:'erase'};if(map[e.key.toLowerCase()])setTool(map[e.key.toLowerCase()]);});
  updateModeUI();applyFormation(defaultFormations[mode]);
})();
</script>
