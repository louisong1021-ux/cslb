<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>羽毛球混双完整体系｜详细版 L1–L6</title><style>
:root{--bg:#07111b;--panel:#0f1e2f;--panel2:#14283e;--text:#eef7ff;--muted:#9db0c3;--line:rgba(255,255,255,.08);--g:#72f2b1;--b:#49caff;--y:#ffd66b;--p:#c8b8ff;--o:#ffb56b;--r:#ff8e8e}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% 0,rgba(73,202,255,.08),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.72}.app{display:grid;grid-template-columns:330px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;overflow:auto;padding:22px 16px;background:rgba(8,20,31,.97);border-right:1px solid var(--line)}.brand{padding:2px 8px 16px;border-bottom:1px solid var(--line)}.brand h1{margin:0 0 5px;font-size:20px}.brand p{margin:0;color:var(--muted);font-size:12px}.home{display:inline-block;margin-top:9px;color:var(--g);font-size:12px;text-decoration:none}.level-title{margin:18px 7px 7px;font-size:10px;font-weight:950;letter-spacing:.08em;color:#71869c}.menu{display:grid;gap:4px}.menu button{width:100%;display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;border:1px solid transparent;border-radius:10px;background:transparent;color:#afbfce;text-align:left;padding:8px 9px;cursor:pointer}.menu button:hover{background:#102135}.menu button.active{background:linear-gradient(135deg,rgba(114,242,177,.13),rgba(73,202,255,.07));border-color:rgba(114,242,177,.22);color:white}.badge{height:29px;border-radius:8px;background:#0c1927;display:grid;place-items:center;font-size:9px;font-weight:950;color:var(--g)}.menu button span:last-child{font-size:12px}.main{min-width:0}.mobile{display:none;position:sticky;top:0;z-index:10;padding:8px 10px;background:rgba(8,20,31,.97);border-bottom:1px solid var(--line);gap:8px}.mobile a{height:42px;padding:0 11px;border-radius:10px;background:var(--g);color:#06131a;display:flex;align-items:center;text-decoration:none;font-size:12px;font-weight:900;white-space:nowrap}.mobile select{flex:1;min-width:0;height:42px;border-radius:10px;background:#102033;color:white;border:1px solid var(--line);padding:0 9px}.content{max-width:1030px;margin:auto;padding:45px 34px 75px}.chapter{display:none}.chapter.active{display:block}.k{color:var(--g);font-size:12px;font-weight:950;letter-spacing:.08em}.chapter h2{font-size:clamp(31px,5vw,49px);line-height:1.12;margin:9px 0 12px}.lead{font-size:17px;color:#bdcad7;max-width:900px}.formula,.call{margin:20px 0;padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,rgba(114,242,177,.10),rgba(73,202,255,.07));border:1px solid rgba(114,242,177,.18);font-weight:800}.call{border-left:4px solid var(--b);font-weight:650}.sec{margin:29px 0}.sec h3{font-size:22px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{padding:16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel2),#0c1a29)}.card strong{display:block;margin-bottom:5px}.card p{margin:0;color:#b2c1d0;font-size:14px}.tbl{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:790px;background:#0c1927}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#14283e;font-size:12px;color:#e8faf0}td{font-size:13px;color:#bac8d6}.seq{padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#091723;font-weight:850}.prob{display:grid;gap:8px}.prow{display:grid;grid-template-columns:95px 1fr;gap:10px;padding:10px 11px;background:#0d1b2a;border:1px solid var(--line);border-radius:10px}.rank{background:var(--g);color:#06131a;font-size:10px;font-weight:950;border-radius:7px;padding:4px 7px;text-align:center;height:max-content}.prow:nth-child(2) .rank{background:var(--b)}.prow:nth-child(3) .rank{background:var(--y)}ul,ol{padding-left:22px}li{margin:5px 0;color:#bdcad7}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}.nav button{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#102033;color:white;cursor:pointer}.nav button:disabled{opacity:.35}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.mobile{display:flex}.content{padding:28px 18px 60px}.grid{grid-template-columns:1fr}.nav{position:sticky;bottom:0;margin-left:-18px;margin-right:-18px;padding:10px 18px;background:linear-gradient(180deg,transparent,rgba(7,17,27,.97) 28%);border:0}.nav button{flex:1}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><h1>混双完整体系</h1><p>详细版 · L1–L6 · 角色与保护链</p><a class="home" href="badminton-doubles.html">← 返回总入口</a></div><div id="menus"></div></aside><main class="main"><div class="mobile"><a href="badminton-doubles.html">← 总入口</a><select id="sel"></select></div><div class="content" id="content"></div></main></div><script>
const C=[
[1,'核心思维','男后女前是默认结构，不是法律',`<p class="lead">混双真正的基础是“默认角色清楚 + 临时责任能切换”。谁更有条件处理下一拍，谁就承担那一拍；角色只决定优先级。</p><div class="formula">混双结构 = 默认优势位置 → 实时球质 → 临时责任 → 轮转恢复 → 再建立优势结构</div><div class="call">为了强行回到“男后女前”而牺牲当前击球质量，是混双最常见的结构错误之一。</div>`],
[1,'女方发球','女方发球后的第三拍责任必须说清楚',`<div class="grid"><div class="card"><strong>发球后</strong><p>守中前场，但不能贴死网；准备对方推身体、推后场和回放。</p></div><div class="card"><strong>男方搭档</strong><p>准备被推后场后的第一下压，同时覆盖女方身后。</p></div><div class="card"><strong>接发回放</strong><p>女方优先处理网前，男方保持后场/中路准备。</p></div><div class="card"><strong>接发推后</strong><p>谁更自然到位谁先处理，不为了角色强行让球。</p></div></div>`],
[1,'男方发球','男方发球不能默认自己发完就退后场',`<p class="lead">男方发球以后仍属于中前场第一责任者。如果对方回放，男方必须敢留前；只有球被推过身后才进入新的轮转。</p><div class="seq">男方短发 → 对方回放：男方前场处理；对方推后：按谁到位更好决定后场责任</div>`],
[1,'女方接发','女方接发要建立前场优势，但不能只会放网',`<div class="prob"><div class="prow"><span class="rank">第一类</span><div>低放网：争前场，但必须准备对方回放/推身后。</div></div><div class="prow"><span class="rank">第二类</span><div>推4号位：挤身体，减少对方第三拍完整挥拍。</div></div><div class="prow"><span class="rank">第三类</span><div>推5/6：把对方拉后，为男方后场接管创造条件。</div></div></div><div class="call">固定编号：1前左、2前中/T、3前右、4身体位、5后场左角、6后场右角。</div>`],
[1,'男方接发','男方接发后的价值常在“接发 + 接管后场”',`<div class="grid"><div class="card"><strong>抢前</strong><p>高点可以扑/推，但女方要立即读取男方是否留前。</p></div><div class="card"><strong>推后</strong><p>男方接发后可能自然进入前场，女方不是自动后退；看下一拍谁更适合处理。</p></div><div class="card"><strong>放网</strong><p>男方高质量放网后也可以暂时承担前场责任。</p></div><div class="card"><strong>被动挑</strong><p>立即进入左右防守，不维持男后女前。</p></div></div>`],
[1,'女前男后','默认进攻结构为什么有效',`<p class="lead">通常男方后场连续下压能力更强、女方前中场拦截价值更高，因此默认结构能放大双方优势。但“默认”必须服从实际能力。</p><div class="seq">男后制造低回球 → 女前压短线/中路 → 女方再制造向上球 → 男方继续后场</div>`],
[1,'男后进攻','男方后场任务是给女方制造可读的前场球',`<div class="grid"><div class="card"><strong>杀身体</strong><p>制造短挡和软中路。</p></div><div class="card"><strong>杀直线</strong><p>方便女方偏置直线+中路。</p></div><div class="card"><strong>点杀</strong><p>保持连续性和恢复。</p></div><div class="card"><strong>快吊</strong><p>让防守后压后突然前冲。</p></div></div><div class="call">男方杀得再重，如果女方无法读取下一拍、男方恢复又慢，组合价值仍然低。</div>`],
[1,'女前责任','女方前场不是“站网前”，而是负责下一拍速度',`<ul><li>按男方真实球质决定压迫程度。</li><li>优先处理中路、短挡和软球。</li><li>第一拍抓不到必须有第二启动。</li><li>推身后、放网、封中也可以继续制造。</li><li>被越顶后立即处理新责任，不原地等换位。</li></ul>`],
[1,'女方被顶后场','最重要的混双基础场景之一',`<p class="lead">女方被顶后场以后，不要第一反应“赶紧换回去”。先把这一拍高质量处理，再根据回球决定是否交换。</p><div class="tbl"><table><tr><th>女方后场球质</th><th>男方</th><th>下一步</th></tr><tr><td>A/B级下压</td><td>可前压接管前场</td><td>形成短暂角色反转</td></tr><tr><td>C级中性</td><td>保持中性，不硬抢</td><td>等待下一次自然轮转</td></tr><tr><td>D级被动</td><td>先转左右/安全结构</td><td>不强行交换</td></tr></table></div>`],
[1,'男方临时前场','男方到前场时必须敢完成前场责任',`<ul><li>高点球该扑就扑，不因为“我是男方”就让女方从后面冲。</li><li>前场被越顶后，谁更自然到位谁承担后场。</li><li>临时前场价值在于减少无效换位成本。</li></ul>`],
[1,'混双防守','被迫起高后就是左右防守，不是男后女前',`<div class="grid"><div class="card"><strong>左右责任</strong><p>按线路、正反手和个人能力分配，不按性别硬分。</p></div><div class="card"><strong>中路</strong><p>提前约定谁优先，特别防止男方过度保护导致外侧空。</p></div><div class="card"><strong>女方防守</strong><p>挡网、抽中、顶深都要能用，避免被锁定只会挑。</p></div><div class="card"><strong>男方保护</strong><p>保护不能提前到把自己责任区完全让掉。</p></div></div>`],
[1,'典型错误','混双最常见的角色错误',`<div class="tbl"><table><tr><th>错误</th><th>为什么错</th><th>修正</th></tr><tr><td>女方一直贴网</td><td>被越顶后无第二启动</td><td>按球质偏置</td></tr><tr><td>男方永远不进前场</td><td>错过自然高点</td><td>临时责任优先</td></tr><tr><td>女方后场急着换</td><td>牺牲当前球质</td><td>先处理再轮转</td></tr><tr><td>防守仍男后女前</td><td>左右覆盖不足</td><td>起高立即左右</td></tr><tr><td>男方过度保护</td><td>自己区域被打穿</td><td>保护有边界</td></tr></table></div>`],
[1,'训练体系','基础训练必须把角色反转练成正常情况',`<ol><li>默认男后女前固定进攻。</li><li>女方随机被顶后场，练先处理球。</li><li>男方随机进入前场，练临时封网。</li><li>加入起高后左右防守。</li><li>半开放回合：只有出现正确触发才换位。</li></ol>`],

[2,'中高级框架','开始利用“角色预期”而不是被角色绑住',`<div class="formula">建立默认角色 → 对手开始针对/保护 → 读取保护方向 → 角色反转或变线 → 攻击第二空间</div>`],
[2,'发接发第二层','混双前三拍要同时考虑“谁被拉离默认位置”',`<div class="grid"><div class="card"><strong>压女方接发</strong><p>看她是否只会放网，再用推后/身体改变。</p></div><div class="card"><strong>压男方发球</strong><p>推男方身后，测试女方是否能接管中前场。</p></div><div class="card"><strong>偷后场</strong><p>不是单纯偷分，而是打乱默认角色。</p></div><div class="card"><strong>第三拍</strong><p>目标是让对方在不舒服角色中处理球。</p></div></div>`],
[2,'男后连续压','男方后场连续不是一直重杀',`<div class="seq">重杀建立后压 → 点杀/身体维持低点 → 快吊改变前后 → 女方继续封压</div><div class="call">男方后场真正指标：女方前场是否越来越容易，而不是杀球声越来越大。</div>`],
[2,'女前制造','女方前场可以主动“做球”给男方',`<ul><li>封中路把对手压低。</li><li>推身后让对手被迫后退。</li><li>高质量放网逼挑球。</li><li>看到对方前场过度保护时，变另一侧。</li></ul>`],
[2,'角色反转','好的混双必须能在反转状态打两三拍不崩',`<div class="grid"><div class="card"><strong>女后男前</strong><p>不是错误；如果女方A/B级下压、男方高点前场，这可能是当前最优结构。</p></div><div class="card"><strong>恢复默认</strong><p>通过自然回球和轮转恢复，不用跑位交换。</p></div></div>`],
[2,'针对女方','针对不是“所有球都打女生”',`<p class="lead">要具体到条件：女方被顶反手后场晚到时回球变短；女方防身体球后更常直线挡；女方前场被越顶后恢复慢。</p><div class="formula">针对 = 人 + 区域 + 到位质量 + 默认答案</div>`],
[2,'针对男方','男方同样可能是可利用的结构点',`<ul><li>连续拉男方后场，观察其恢复和体能。</li><li>男方过度保护女方时，打他原责任区。</li><li>男方临时前场技术弱时，主动迫使角色反转。</li><li>关键分测试男方接发是否过于激进。</li></ul>`],
[2,'保护与反保护','混双第二层核心：利用搭档保护动作',`<div class="seq">压女方后场 → 男方开始偏后/偏中保护 → 男方原前场或另一侧变薄 → 攻新空间</div><div class="call">如果对方完全不保护，继续打弱区；一旦保护出现，才进入反保护。</div>`],
[2,'轮转成本','不是所有换位都值得',`<div class="tbl"><table><tr><th>情况</th><th>是否强行换</th></tr><tr><td>女方后场A/B级</td><td>不急，允许短暂反转</td></tr><tr><td>女方后场C级</td><td>等待自然球路</td></tr><tr><td>女方后场D级</td><td>先安全防守</td></tr><tr><td>男方前场高点</td><td>先完成前场责任</td></tr></table></div>`],
[2,'比分策略','关键分角色更要简单清楚',`<div class="grid"><div class="card"><strong>发球</strong><p>用本场最稳定的落点。</p></div><div class="card"><strong>接发</strong><p>明确谁接发后更可能留前。</p></div><div class="card"><strong>被打乱</strong><p>用安全轮转，不临时创造复杂换位。</p></div><div class="card"><strong>保护</strong><p>不因紧张扩大保护范围。</p></div></div>`],

[3,'高级比赛阅读','高级混双读的是“角色保护体系”',`<p class="lead">一方被针对以后，另一方如何提前保护，是混双最有价值的信息之一。保护会减少一个弱点，同时创造另一个空间。</p><div class="formula">针对 → 保护 → 新空档 → 反保护 → 对方角色再调整</div>`],
[3,'女方 Profile','女方模型必须按场景记录',`<div class="grid"><div class="card"><strong>接发</strong><p>1–6不同落点下默认答案。</p></div><div class="card"><strong>前场</strong><p>扑、封中、被越顶后的第二启动。</p></div><div class="card"><strong>后场</strong><p>被顶两侧后的到位、线路和恢复。</p></div><div class="card"><strong>防守</strong><p>身体/直线/中路后的默认出口。</p></div></div>`],
[3,'男方 Profile','男方模型重点看连续能力和保护边界',`<ul><li>后场连续几拍仍保持质量。</li><li>女方被针对后男方从哪里开始保护。</li><li>临时前场时是否能高质量处理。</li><li>过度保护后最容易暴露哪个区域。</li><li>关键分是否更爱重杀/抢接发。</li></ul>`],
[3,'保护链','保护不是一个动作，而是一串责任变化',`<div class="seq">女方被压后场 → 男方后移保护 → 前场压力减弱 → 对方敢放网 → 女方/男方恢复默认更困难</div><p class="lead">教练和球员要看到保护带来的连锁，而不是只看到“男方帮了一拍”。</p>`],
[3,'反保护','真正高级的是攻击保护后产生的新空间',`<div class="grid"><div class="card"><strong>男方偏后</strong><p>前场/中前场空间增加。</p></div><div class="card"><strong>男方偏中</strong><p>外侧线路增加。</p></div><div class="card"><strong>女方过度守前</strong><p>越顶身后增加。</p></div><div class="card"><strong>两人频繁换位</strong><p>中路责任容易短暂混乱。</p></div></div>`],
[3,'诱导与反诱导','对方也可能故意让你“看到女方弱点”',`<p class="lead">如果某个女方弱区突然非常开放，要考虑男方是否已经提前准备反抓。不要把“传统混双思维”变成对方的诱饵。</p><div class="call">弱点存在 ≠ 这一拍有攻击弱点的许可。</div>`],
[3,'非对称空间','混双空间价值取决于谁在那个位置',`<ul><li>同一个后场角，如果是男方到位和女方晚到，价值完全不同。</li><li>同一个前场空档，如果男方已经前压，可能并不是空档。</li><li>判断空间必须同时包含“人、位置、到位时间、角色恢复成本”。</li></ul>`],
[3,'角色决策树','每个反转场景至少准备两层答案',`<div class="seq">女方后场A/B级下压 → 男方前场压 → 对方越顶男方 → 谁更自然到位谁接管后场 → 再决定是否恢复默认</div>`],
[3,'关键分模式','压力下最容易回到“传统角色”或过度保护',`<div class="tbl"><table><tr><th>变化</th><th>可利用点</th></tr><tr><td>男方保护范围扩大</td><td>他的原责任区</td></tr><tr><td>女方更贴网</td><td>越顶身后</td></tr><tr><td>男方更重杀</td><td>恢复和下一拍质量</td></tr><tr><td>女方接发只放网</td><td>前三拍预判</td></tr></table></div>`],
[3,'录像与数据','录像要同时看角色、球质和轮转成本',`<ul><li>默认结构建立率。</li><li>女方被顶后场后的球质和脱困率。</li><li>男方临时前场成功率。</li><li>保护出现以后对方是否立即反保护。</li><li>角色反转后能稳定维持几拍。</li></ul>`],

[4,'球质等级','角色选择也必须服从A/B/C/D',`<div class="tbl"><table><tr><th>等级</th><th>角色许可</th></tr><tr><td>A</td><td>允许更激进默认结构或角色反转压迫</td></tr><tr><td>B</td><td>偏置，但不强行换位</td></tr><tr><td>C</td><td>中性，优先争高点和结构</td></tr><tr><td>D</td><td>取消角色计划，先恢复左右/安全阵型</td></tr></table></div>`],
[4,'时间·击球点·姿态','“女方在后场”本身不是问题',`<p class="lead">真正问题是她是否晚到、触球低、身体失衡。如果女方提前高点到位，强行让男方换回后场反而可能降低质量。</p><div class="seq">谁在位置 → 是否到位 → 击球点 → 姿态 → 搭档位置 → 再决定角色</div>`],
[4,'技术—角色耦合','组合角色必须建立在真实个人能力上',`<div class="grid"><div class="card"><strong>女方后场</strong><p>高点下压、平高和安全过渡决定反转能力。</p></div><div class="card"><strong>男方前场</strong><p>封中、推、放和二次启动决定临时前场价值。</p></div><div class="card"><strong>女方防守</strong><p>三出口能力决定男方是否需要扩大保护。</p></div><div class="card"><strong>男方恢复</strong><p>后场连续后能否及时覆盖，决定保护边界。</p></div></div>`],
[4,'轮转许可','什么时候可以换，什么时候绝对不要强换',`<div class="prob"><div class="prow"><span class="rank">可换</span><div>回球制造向上/软球，双方自然移动方向形成交换。</div></div><div class="prow"><span class="rank">可维持反转</span><div>女方高质量后场 + 男方高点前场。</div></div><div class="prow"><span class="rank">不可强换</span><div>低点、失衡、对方仍有主动下压。</div></div></div>`],
[4,'保护许可','保护必须由当前威胁决定，不由性别决定',`<ul><li>女方真正被压住才扩大保护。</li><li>女方有高点时男方不抢她正常责任。</li><li>男方自己责任区高威胁时先守自己的。</li><li>保护后必须准备对方反保护。</li></ul>`],
[4,'动态决策矩阵','混双实时优先级',`<div class="formula">当前球质 ＞ 当前击球者能力/姿态 ＞ 搭档位置 ＞ 对手保护方向 ＞ 历史角色趋势 ＞ 预设男后女前</div>`],
[4,'战术降级','角色计划必须允许随时取消',`<p class="lead">计划让男方重新回后场，但女方这一拍只有D级球：取消。计划女方贴前，但男方上一拍只是C级：取消。高级混双最重要的是不被自己的角色计划绑架。</p>`],
[4,'职业训练闭环','把角色判断练成画面反应',`<ol><li>A/B/C/D球质报级。</li><li>随机女方后场，先判断是否需要交换。</li><li>随机男方前场，练临时责任。</li><li>视频暂停判断保护是否合理。</li><li>半开放回合练“取消换位”。</li></ol>`],

[5,'赛前 Scouting','混双赛前必须分开建男/女两套档案，再研究保护关系',`<div class="grid"><div class="card"><strong>女方</strong><p>接发、前场、后场两侧、防守和关键分。</p></div><div class="card"><strong>男方</strong><p>后场连续、临时前场、接发和保护范围。</p></div><div class="card"><strong>组合</strong><p>默认角色、保护触发、轮转习惯。</p></div><div class="card"><strong>环境</strong><p>球速/风向会改变后场角色压力。</p></div></div>`],
[5,'前6分测试','前6分重点测试“角色边界”',`<ol><li>测试女方4号位接发。</li><li>测试女方两侧后场。</li><li>测试男方临时前场。</li><li>测试男方何时开始保护。</li><li>测试角色反转后两人能维持多久。</li></ol>`],
[5,'针对女方链','针对女方必须设计到第二层',`<div class="seq">压女方特定后场 → 观察男方保护 → 如果男方不保护继续压 → 如果保护则立即攻击男方让出的区域</div>`],
[5,'针对男方链','不要默认男方不能成为主攻对象',`<ul><li>连续让男方后场移动，测试恢复。</li><li>逼男方前场处理，测试细腻度。</li><li>利用男方保护冲动制造反方向。</li><li>关键分测试其接发风险。</li></ul>`],
[5,'发接发矩阵','四个人的前三拍责任要单独记录',`<div class="tbl"><table><tr><th>人</th><th>重点</th></tr><tr><td>对方女方接发</td><td>1–6落点、放/推习惯、男方保护</td></tr><tr><td>对方男方接发</td><td>抢前程度、接发后角色</td></tr><tr><td>我方女方接发</td><td>最稳定三种与男方补位</td></tr><tr><td>我方男方接发</td><td>接发后是否留前/转后</td></tr></table></div>`],
[5,'Plan A / B / C','混双计划必须包含角色被打乱时怎么办',`<div class="grid"><div class="card"><strong>Plan A</strong><p>默认优势结构。</p></div><div class="card"><strong>Plan B</strong><p>对方保护后反保护。</p></div><div class="card"><strong>Plan C</strong><p>我方角色被持续打乱时的安全轮转和左右防守。</p></div><div class="card"><strong>退出条件</strong><p>什么时候不再强求默认角色。</p></div></div>`],
[5,'11分间歇','混双间歇必须同时给两个人具体责任',`<div class="seq">对方正在针对谁 → 保护是否过度 → 一个调整 → 男方责任一句 → 女方责任一句 → 下一分验证</div>`],
[5,'关键分','关键分最怕角色焦虑',`<ul><li>女方不要因为紧张更贴网。</li><li>男方不要因为紧张扩大保护到失去自己责任。</li><li>被打乱后用训练过的安全结构。</li><li>继续使用本场已验证的发接发模式。</li></ul>`],
[5,'赛后验证','赛后把失分拆成角色、技术、球质与保护',`<div class="tbl"><table><tr><th>失分</th><th>追问</th></tr><tr><td>女方后场失分</td><td>是能力问题还是被迫低点？</td></tr><tr><td>男方保护后失分</td><td>保护是否真的必要？</td></tr><tr><td>角色反转断线</td><td>谁先急着换位？</td></tr><tr><td>防守中路失分</td><td>责任协议还是过度保护？</td></tr></table></div>`],

[6,'Pair Identity','高性能混双必须有自己的角色身份',`<div class="grid"><div class="card"><strong>传统男后女前型</strong><p>默认优势非常明显。</p></div><div class="card"><strong>快速轮转型</strong><p>男女都能跨区处理。</p></div><div class="card"><strong>女方后场能力强型</strong><p>角色反转威胁大。</p></div><div class="card"><strong>双人全面型</strong><p>对方更难通过角色针对。</p></div></div>`],
[6,'角色能力图','用能力图决定角色，不用性别标签决定角色',`<div class="tbl"><table><tr><th>能力</th><th>男方</th><th>女方</th></tr><tr><td>发接发</td><td>记录</td><td>记录</td></tr><tr><td>前场</td><td>临时接管能力</td><td>默认优势能力</td></tr><tr><td>后场</td><td>连续压迫</td><td>反转处理/脱困</td></tr><tr><td>防守</td><td>保护边界</td><td>独立防守出口</td></tr></table></div>`],
[6,'技术限制链','角色问题必须追到真正技术限制',`<div class="formula">角色被打穿 → 到位慢？ → 击球点低？ → 技术选择少？ → 恢复慢？ → 搭档保护过度？ → 战术设计错误？</div>`],
[6,'角色反转能力','反转能力是高水平混双的重要保险',`<ul><li>女方后场至少能稳定处理两三拍。</li><li>男方前场至少能封、推、放并二次启动。</li><li>双方都知道反转什么时候结束。</li><li>训练中不允许一反转就急着换回。</li></ul>`],
[6,'保护边界','真正成熟的组合知道“帮到哪里为止”',`<p class="lead">保护范围应由搭档真实球质、自己位置和对方威胁共同决定。保护越多不代表配合越好；过度保护会让组合空间失衡。</p><div class="call">高水平默契 = 既知道什么时候帮，也知道什么时候不要帮。</div>`],
[6,'组合 KPI','混双指标必须同时测角色与反转',`<ul><li>默认优势结构建立率。</li><li>女方后场脱困率。</li><li>男方临时前场成功率。</li><li>角色反转维持质量。</li><li>保护后被反打失分。</li><li>被迫起高后左右防守稳定性。</li><li>关键分角色责任错误。</li></ul>`],
[6,'沟通协议','混双沟通重点是责任边界',`<div class="tbl"><table><tr><th>场景</th><th>协议</th></tr><tr><td>女方被顶后场</td><td>什么球男方前压，什么球保持中性</td></tr><tr><td>男方临时前场</td><td>越顶后谁接管</td></tr><tr><td>防守中路</td><td>谁优先，不因保护改变</td></tr><tr><td>关键分</td><td>默认发接发和安全轮转</td></tr></table></div>`],
[6,'训练周期','高性能周期要同时练优势和“被打乱后的生存”',`<div class="grid"><div class="card"><strong>基础期</strong><p>个人技术、默认角色、左右防守。</p></div><div class="card"><strong>专项期</strong><p>角色反转、保护/反保护、前三拍。</p></div><div class="card"><strong>赛前期</strong><p>对手角色测试、关键分。</p></div><div class="card"><strong>比赛期</strong><p>维持优势结构和恢复。</p></div></div>`],
[6,'对手库','长期记录每对混双的角色体系',`<ul><li>默认男女位置。</li><li>女方被针对后的男方保护模式。</li><li>男方被拉前后的处理质量。</li><li>角色反转是否主动或被动。</li><li>关键分是否回到传统结构。</li></ul>`],
[6,'长期闭环','最终目标是建立“自己的混双”，不是复制标准答案',`<div class="formula">个人能力图 → Pair Identity → 角色协议 → 比赛验证 → 保护/反保护更新 → 长期组合升级</div><p class="lead">真正世界级的混双不是角色最固定，而是默认优势清楚、被打乱以后仍能保持质量。</p>`]
];
const menus=document.getElementById('menus'),sel=document.getElementById('sel'),content=document.getElementById('content');let cur=0,lastL=0;C.forEach((c,i)=>{if(c[0]!==lastL){lastL=c[0];const t=document.createElement('div');t.className='level-title';t.textContent=`L${c[0]} · ${['','基础结构','中高级战术','高级比赛阅读','国际职业决策','比赛工程','高性能组合'][c[0]]}`;menus.appendChild(t)}const wrap=document.createElement('div');wrap.className='menu';const n=C.filter((x,j)=>j<=i&&x[0]===c[0]).length,b=document.createElement('button');b.innerHTML=`<span class="badge">L${c[0]}-${String(n).padStart(2,'0')}</span><span>${c[1]}</span>`;b.onclick=()=>show(i,true);wrap.appendChild(b);menus.appendChild(wrap);const o=document.createElement('option');o.value=i;o.textContent=`L${c[0]} · ${c[1]}`;sel.appendChild(o);const s=document.createElement('section');s.className='chapter';s.innerHTML=`<div class="k">L${c[0]} · ${c[1]}</div><h2>${c[2]}</h2>${c[3]}`;content.appendChild(s)});const nav=document.createElement('div');nav.className='nav';nav.innerHTML='<button id="prev">← 上一章</button><button id="next">下一章 →</button>';content.appendChild(nav);const secs=[...document.querySelectorAll('.chapter')],btns=[...document.querySelectorAll('.menu button')],prev=document.getElementById('prev'),next=document.getElementById('next');function show(i,push=false){cur=Math.max(0,Math.min(C.length-1,i));secs.forEach((s,n)=>s.classList.toggle('active',n===cur));btns.forEach((b,n)=>b.classList.toggle('active',n===cur));sel.value=cur;prev.disabled=cur===0;next.disabled=cur===C.length-1;if(push)history.replaceState(null,'',`#l${C[cur][0]}-c${C.filter((x,j)=>j<=cur&&x[0]===C[cur][0]).length}`);scrollTo({top:0,behavior:'smooth'})}sel.onchange=()=>show(+sel.value,true);prev.onclick=()=>show(cur-1,true);next.onclick=()=>show(cur+1,true);const m=location.hash.match(/l(\d)-c(\d+)/);if(m){const ids=C.map((x,i)=>x[0]===+m[1]?i:null).filter(x=>x!==null);show(ids[Math.max(0,+m[2]-1)]??0,false)}else show(0,false);
</script></body></html>
