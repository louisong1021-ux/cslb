<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>羽毛球完整教程｜单打 · 男双 · 女双 · 混双</title><style>:root{--bg:#07111b;--text:#eef7ff;--muted:#9dafc2;--line:rgba(255,255,255,.08);--green:#72f2b1;--blue:#49caff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 85% 5%,rgba(73,202,255,.10),transparent 30%),radial-gradient(circle at 10% 20%,rgba(114,242,177,.07),transparent 26%),var(--bg);color:var(--text)}body.viewer-open{overflow:hidden}.wrap{max-width:1180px;margin:auto;padding:54px 24px 80px}.hero{margin-bottom:30px}.hero h1{font-size:clamp(40px,7vw,68px);line-height:1.03;margin:0 0 14px}.hero p{color:#bcc9d7;font-size:17px;line-height:1.75;margin:0}.projects{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}.project{min-height:150px;display:flex;align-items:center;justify-content:center;padding:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(17,30,47,.96),rgba(11,22,34,.96));box-shadow:0 16px 44px rgba(0,0,0,.18);text-decoration:none;color:inherit;cursor:pointer;transition:.16s ease}.project:hover{transform:translateY(-2px);border-color:rgba(114,242,177,.36);background:#132237}.project span{font-size:clamp(28px,4vw,40px);font-weight:950;letter-spacing:.04em}.coach-entry{margin-top:24px;padding:22px;border:1px solid rgba(114,242,177,.18);border-radius:24px;background:linear-gradient(135deg,rgba(114,242,177,.08),rgba(73,202,255,.05))}.coach-entry h2{font-size:28px;margin:0 0 6px}.coach-entry>p{margin:0 0 15px;color:#9fb0c2;font-size:14px}.coach-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.coach-card{display:grid;grid-template-columns:52px 1fr auto;gap:11px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:15px;background:#0f2030;text-decoration:none;color:inherit;cursor:pointer}.coach-badge{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--blue));color:#06131a;font-size:10px;font-weight:950}.coach-card h3{margin:0 0 4px;font-size:16px}.coach-card p{margin:0;color:#93a6ba;font-size:11.5px;line-height:1.45}.footer{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);color:#71859a;font-size:12px;text-align:center}.viewer{position:fixed;inset:0;z-index:1000;display:none;background:var(--bg)}.viewer.active{display:grid;grid-template-rows:64px minmax(0,1fr)}.viewerbar{display:flex;align-items:center;gap:13px;padding:8px 14px;border-bottom:1px solid rgba(114,242,177,.22);background:rgba(8,17,27,.99);box-shadow:0 10px 32px rgba(0,0,0,.30)}.backbtn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 20px;border:2px solid #b6ffd8;border-radius:13px;background:#72f2b1;color:#06131a;font:inherit;font-size:16px;font-weight:950;cursor:pointer;white-space:nowrap}.viewer-title{min-width:0;font-size:14px;font-weight:850;color:#d9e8f3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.viewer-level{margin-left:auto;color:#7f95aa;font-size:12px}.viewer iframe{width:100%;height:100%;border:0;background:var(--bg)}@media(max-width:900px){.wrap{padding:38px 18px 58px}.projects{grid-template-columns:1fr 1fr}.coach-grid{grid-template-columns:1fr 1fr}.hero h1{font-size:42px}}@media(max-width:620px){.projects{grid-template-columns:1fr 1fr;gap:10px}.project{min-height:105px;padding:16px;border-radius:17px}.project span{font-size:25px}.coach-entry{padding:15px}.coach-grid{grid-template-columns:1fr}.viewerbar{padding:8px 10px;gap:8px}.backbtn{height:48px;min-width:140px;padding:0 14px;font-size:15px}.viewer-level{display:none}}</style></head><body><main class="wrap"><section class="hero"><h1>羽毛球完整教程</h1><p>选择项目进入完整教程。</p></section><section class="projects"><a class="project" href="badminton-singles-hub.html" data-key="singles" data-title="单打"><span>单打</span></a><a class="project" href="badminton-mens-doubles-system.html" data-key="mens-doubles" data-title="男双"><span>男双</span></a><a class="project" href="badminton-womens-doubles-system.html" data-key="womens-doubles" data-title="女双"><span>女双</span></a><a class="project" href="badminton-mixed-doubles-system.html" data-key="mixed-doubles" data-title="混双"><span>混双</span></a></section><section class="coach-entry"><h2>我是教练</h2><p>教练内容按项目完全分开。</p><div class="coach-grid"><a class="coach-card" href="badminton-coach-singles-system.html" data-key="coach-s" data-title="我是教练 · 单打"><div class="coach-badge">单打</div><div><h3>单打教练</h3><p>上游诊断 · 技术/移动/战术分类 · 场边 · Athlete Model</p></div><div>→</div></a><a class="coach-card" href="badminton-coach-mens-doubles-system.html" data-key="coach-md" data-title="我是教练 · 男双"><div class="coach-badge">男双</div><div><h3>男双教练</h3><p>前三拍 · 球质/责任 · 同步轮转 · Pair Model</p></div><div>→</div></a><a class="coach-card" href="badminton-coach-womens-doubles-system.html" data-key="coach-wd" data-title="我是教练 · 女双"><div class="coach-badge">女双</div><div><h3>女双教练</h3><p>连续质量 · 防转攻 · 轮转断点 · 疲劳模型</p></div><div>→</div></a><a class="coach-card" href="badminton-coach-mixed-doubles-system.html" data-key="coach-xd" data-title="我是教练 · 混双"><div class="coach-badge">混双</div><div><h3>混双教练</h3><p>角色诊断 · 保护/反保护 · 轮转许可 · Pair Model</p></div><div>→</div></a></div></section><div class="footer">单打 · 男双 · 女双 · 混双 · 四套独立教练系统</div></main><section class="viewer" id="viewer" aria-hidden="true"><div class="viewerbar"><button class="backbtn" id="backBtn" type="button">← 返回总入口</button><div class="viewer-title" id="viewerTitle">教程</div><div class="viewer-level" id="viewerLevel"></div></div><iframe id="frame" title="羽毛球教程"></iframe></section><script>const viewer=document.getElementById('viewer'),frame=document.getElementById('frame'),back=document.getElementById('backBtn'),title=document.getElementById('viewerTitle'),level=document.getElementById('viewerLevel'),cards=[...document.querySelectorAll('[data-key]')],map=new Map(cards.map(c=>[c.dataset.key,c]));function openCard(c,push=true){if(!c)return;frame.src=c.getAttribute('href');title.textContent=c.dataset.title||'教程';level.textContent=c.dataset.key.startsWith('coach')?'教练':'球员';viewer.classList.add('active');viewer.setAttribute('aria-hidden','false');document.body.classList.add('viewer-open');if(push)history.pushState({key:c.dataset.key},'',`#${c.dataset.key}`)}function close(push=true){viewer.classList.remove('active');viewer.setAttribute('aria-hidden','true');document.body.classList.remove('viewer-open');frame.src='about:blank';if(push)history.pushState({},'',location.pathname+location.search)}cards.forEach(c=>c.addEventListener('click',e=>{e.preventDefault();openCard(c,true)}));back.onclick=()=>close(true);window.addEventListener('popstate',()=>{const k=location.hash.slice(1);map.has(k)?openCard(map.get(k),false):close(false)});const initial=location.hash.slice(1);if(map.has(initial))openCard(map.get(initial),false);</script></body></html>
