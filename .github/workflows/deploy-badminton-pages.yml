name: Deploy CSLB tools to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "player-database/**"
      - "badminton-stat-tool/**"
      - "badminton-tactics-board/**"
      - ".github/workflows/deploy-badminton-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build Pages artifact
        run: |
          mkdir -p _site/player-database _site/badminton-stat-tool _site/badminton-tactics-board
          cp -R player-database/. _site/player-database/
          cp -R badminton-stat-tool/. _site/badminton-stat-tool/
          cp -R badminton-tactics-board/. _site/badminton-tactics-board/
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
