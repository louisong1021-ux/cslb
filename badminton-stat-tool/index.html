<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>羽毛球比赛统计分析工具</title>
  <style>
    body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f4f7fb;color:#173458}
    .loading{text-align:center}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#1268f3;margin:0 3px;animation:b 1s infinite alternate}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes b{to{opacity:.25;transform:translateY(-4px)}}
  </style>
</head>
<body>
  <div class="loading">正在加载羽毛球统计工具<br><br><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <script>
    const APP_VERSION='20260818-unified1';
    Promise.all(['parts/part0.html','parts/part1.html','parts/part2.html'].map(p=>fetch(`${p}?v=${APP_VERSION}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p);return r.text()})))
      .then(parts=>{
        document.open();document.write(parts.join(''));document.close();

        ['button-controls.css','mobile-layout.css','linked-fields.css','top-actions-layout.css','rally-footer-editor.css','optimized-stats.css'].forEach(href=>{
          const css=document.createElement('link');
          css.rel='stylesheet';
          css.href=`${href}?v=${APP_VERSION}`;
          document.head.appendChild(css);
        });

        ['count-display.js','button-controls.js','mobile-layout.js','linked-fields.js','top-actions-layout.js','our-server-stats.js','rally-footer-editor.js','optimized-stats.js'].forEach(src=>{
          const script=document.createElement('script');
          script.src=`${src}?v=${APP_VERSION}`;
          script.async=false;
          document.body.appendChild(script);
        });
      })
      .catch(err=>{document.body.innerHTML='<div style="padding:32px"><h2>加载失败</h2><p>请刷新页面后重试。</p><pre>'+String(err)+'</pre></div>';});
  </script>
</body>
</html>
